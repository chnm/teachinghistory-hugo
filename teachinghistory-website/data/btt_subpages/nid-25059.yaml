- subpage: 1
  title: The Protocol of Peace (1910)
  annotation: The Protocol of Peace settled a nine-week strike of cloak makers in New York City. This
    strike was only one in a series of such labor actions during the early 20th century, but the intervention
    of the established, middle- and upper-class Jewish community helped bring the parties to the negotiating
    table. While not everyone involved was Jewish, the vast majority of the manufacturers and most of
    the workers were, as were the negotiators, including Meyer London, the attorney for the union (a Socialist
    who was later elected to represent the Lower East Side district in Congress); Julius Cohen, the attorney
    for the manufacturers; and Louis Marshall. The provision that Jewish workers who observed the Sabbath
    could work on Sundays instead demonstrated the Jewish sensibilities involved in the negotiations.
    Less obvious from the document, with its talk of “union men,” was the high percentage of women workers
    in the International Ladies Garment Workers’ Union. Although the strike would not have succeeded without
    these women, the minimum-wage scale for various job descriptions set up by the Protocol of Peace continued
    to discriminate against women, with the jobs designated for women earning less than similar jobs designated
    for men. The Protocol of Peace was, for its time, quite favorable for the workers, who won a 50-hour
    work week. However, working conditions remained deplorable, as tragically seen in the Triangle Shirtwaist
    Factory Fire only six months later.
  text: "*Excerpt from* **\"The Protocol of Peace in the Cloak, Suit, and Skirt Trade\"***:*  \nProtocol\
    \ of an agreement entered into this 2nd day of September, 1910, between the Cloak, Suit & Skirt Manufacturers’\
    \ Protective Association, herein called the manufacturers, and the following locals of the International\
    \ Ladies’ Garment Workers’ Union. . .\n\nWhereas, differences have arisen between the manufacturers\
    \ and their employees who are members of the unions with regard to various matters, which have resulted\
    \ in a strike, and it is now desired by the parties hereto to terminate said strike and to arrive\
    \ at an understanding with regard to the future relations between the manufacturers and their employees,\
    \ it is therefore stipulated as follows:\n\nFirst: So far as practicable, and by December 31st, 1910,\
    \ electric power be installed for the operation of machines, and that no charge for power be made\
    \ against any of the employees of the manufacturers.\n\nSecond: No charge shall be made against any\
    \ employees of the manufacturers for material except in the event of the negligence or wrongful act\
    \ of the employees resulting in loss or injury to the employer. . .\n\nFourth: No work shall be given\
    \ to or taken to employees to be performed at their homes.\n\nSeventh: Employees shall not be required\
    \ to work during the ten (10) legal holidays as established by the laws of the State of New York;\
    \ and no employees shall be permitted to work more than six (6) days in each week, those observing\
    \ Saturday to be permitted to work Sunday in lieu thereof; all week workers to receive pay for legal\
    \ holidays.\n\nEighth: The manufacturers will establish a regular weekly pay day and they will pay\
    \ for labor in cash, and each piece worker will be paid for all work delivered as soon as his work\
    \ is inspected and approved, which shall be within a reasonable time.\n\nTenth:. . .The weekly hours\
    \ of labor shall consist of fifty (50) hour in six (6) working days, to wit, nine hours on all days\
    \ except the sixth day, which shall consist of five hours only.\n\nFourteenth: Each member of the\
    \ manufacturers is to maintain a union shop; a “union shop” being understood to refer to a shop where\
    \ union standards as to working conditions, hours of labor and rates of wages as herein stipulated\
    \ prevail, and where, when hiring help, union men are preferred; it being recognized that, since there\
    \ are differences in degrees of skill among those employed in the trade, employers shall have freedom\
    \ of selection as between one union man and another, and shall not be confined to any list, nor bound\
    \ to follow any prescribed order whatever.  \n  \nSixteenth: The parties hereby establish a Board\
    \ of Arbitration to consist of three (3) members, composed of one nominee of the manufacturers, one\
    \ nominee of the unions, and one representative of the public, the latter to be named by Meyer London,\
    \ Esq., and Julius Cohen, Esq., and in the even of their inability to agree, by Louis Marshall, Esq."
  citation: '"The Protocol of Peace in the Cloak, Suit, and Skirt Trade, September 2, 1910" in Jacob Rader
    Marcus, ed., *The Jew in the American World: A Source Book*. Detroit: Wayne State University Press,
    1996. Excerpts available through [Google Books](http://books.google.com/books?id=Q8fq8ct7KmgC&printsec=frontcover&dq=The+Jew+in+the+American+World:+A+Source+Book&hl=en&ei=3gJETo_YHNK80AGWnvmuCQ&sa=X&oi=book_result&ct=result&resnum=1&ved=0CCwQ6AEwAA#v=onepage&q&f=false),
    page 326.'
- subpage: 2
  title: National Council of Jewish Women (1926)
  annotation: The National Council of Jewish Women was founded in 1893 with a primarily religious and
    educational mission, but, like many Progressive Era women’s organizations, soon turned to a variety
    of reform activities. The National Council of Jewish Women pioneered a program that sent representatives
    to the docks to make sure that Jewish women immigrating alone had some place safe to go. Razovsky
    headed the organization’s immigrant aid efforts and lobbied for the Cable Act of 1922, which guaranteed
    independent female citizenship (though only to women married to men eligible for naturalization).
  text: 'Do You Wish to Become a Useful Citizen? Many organizations — public and private — are eager to
    help you prepare yourself for citizenship. The Public Schools, the settlements and neighborhood houses
    near your home, all have day and evening classes to which they invite you. Go to them. If you have
    little children whom you cannot leave at home, take them with you; they will be cared for in kindergartens
    while you attend your class. The National Council of Jewish Women have organized English and citizenship
    classes in every city in this country for women who wish to become citizens. If you wish information
    about these classes, write to: Department of Immigrant Aide, The National Council of Jewish Women,
    799 Broadway, New York City This Department will be glad to refer you to the proper classes in your
    city. Attend these classes regularly, even if it means that you must work harder when you come home.
    You will feel repaid. You will find a new world opened to you. You will realize you are a human begin,
    not merely a kitchen drudge ߜ always scrubbing and washing and cooking, and never having any outside
    interests or pleasures. You will be proud of yourself when you can read your children''s school books
    and reports. And your husband and children will be proud of you too!'
  citation: 'Cecelia Razovsky, [Vos Yede Froy Darf Visen Veger Birgershaft: What Every Woman Should Know
    About Citizenship](http://www.archive.org/details/nybc202204). National Council of Jewish Women, 1926.
    [Booklet](http://ia700308.us.archive.org/28/items/nybc202204/nybc202204.pdf).'
- subpage: 3
  title: Mendelson Letter (1909)
  annotation: The Galveston Plan demonstrated not only the relationship between the established American
    Jewish community and Jewish immigrants but also the connections among Jews worldwide. The Jewish Territorial
    Organization (in English abbreviated to ITO, an acronym derived from the Hebrew/Yiddish alphabet used
    for the agency’s official name) had representatives stationed throughout Europe to assist Jewish immigrants
    who agreed to exchange control over where they were placed in the U.S. for full payment of all costs
    associated with the immigration process. In the U.S., wealthy Jewish banker and philanthropist Jacob
    Schiff funded the network of representatives who met and assisted immigrants in Galveston and found
    communities across the interior of the country that were willing to secure jobs and housing for the
    new arrivals. Mendelson was not correct that no Jewish immigrants stayed in Galveston, but the majority
    were very quickly moved on to their new homes. Although it probably was easier to earn a living in
    these towns, the small size of the Jewish communities proved troubling for some, and a sizable percentage
    of the Galveston Plan immigrants eventually moved again to areas with larger Jewish populations.
  text: '*Excerpt from **Sheyne-Gadye Mendelson''s letter of July 28, 1909:*** Burlington, July 28, 1909
    My dear, dear brother! I can finally write you a letter and share everything with you. I did write
    you a postcard from Galveston. That was on Saturday. We arrived here Monday evening at nine o’clock.
    Someone was already waiting for us here and had already taken care of everything. We have free room
    and board for a week, which is naturally being paid for by the ITO. Next week we’ll start working
    in a button factory, where we’ll start making 4 or 5 dollars a week and we can work our way up until
    each of us can earn 10 dollars a week. Burlington is a country [sic], that is, a small city that has
    about twenty-five thousand residents. The city is growing, has train connections with the biggest
    cities, and is 175 English miles from Chicago. The climate here is temperate, that is, not too hot
    and not too cold. It’s not too expensive to live here. I hope we’ll be able to work our way up. Other
    than that, we’re healthy and cheerful. . . The entire journey to Galveston was very nice, but it got
    hotter and hotter by the day, so much so that we would walk around barefoot in our undergarments and
    sleep on the deck. It was impossible to stay in the cabin because of the heat. But aside from that,
    we had a good time on the ship. There were [330] emigrants, about 200 Jews, most of them going to
    Baltimore. To Galveston there [43] of us. So we finally arrived on Saturday the 24th in Galveston.
    It’s hard to imagine how much the ITO did for the emigrants. Picture this, as we disembarked from
    the ship, the representative of the local committee, Mr. Greenberg, was already there waiting for
    us and had taken care of everything for us. The ITO emigrants don’t have to pay the 4 dollar head
    tax for each person that enters America. They picked up our baggage and drove us in cars to the committee’s
    center, a big, beautiful house with all the comforts, even bathrooms; we each got to take a bath.
    They gave us only the best food. The same day, they specified where each of us was going to go. No
    one settles in Galveston. They sent the heavy baggage ahead and gave us free train tickets to wherever
    each of us was going–Burlington for us. They also gave us food for the trip: eggs, sardines, bread,
    and other such things. We were on the train for thirty-two house. The trip here from Galveston costs
    around 25 dollars per ticket per person. The baggage costs money as well. When we got there there
    was someone waiting for us in the train station who had set everything up for our first week. That
    also costs money and it was all paid for by the ITO. The only thing left to wish for is that the ITO
    would be able to influence the entire flow of Jewish emigration and systematically organize it. Then
    we could hope to be able to concentrate rapidly in one place and live as a normal people, like all
    others. Dear brother, I now believe I’ve written you all the details. I will only be able to write
    about what life is like here after a few weeks when we are better acquainted with this place. In the
    meantime, we are resting up from the long trip, taking walks. Burlington is a very lovely city. There
    are not many Jewish families here–maybe all told, twenty families–but everyone is making a nice living.'
  citation: 'Sheyne-Gadye Mendelson to her brother, July 28, 1909 (letter) in Gur Alroey, [*Bread to Eat
    and Clothes to Wear: Letters from Jewish Migrants in the Early Twentieth Century*](http://books.google.com/books?id=CLhPfF8y_j0C).
    Detroit: Wayne State University Press, 2011.'
- subpage: 4
  title: Capin’s Tailor Shop (1919)
  annotation: |-
    Hyman Capin opened the tailor shop pictured here in 1914. By that time he was already an experienced tailor who had worked for the army as well as for himself. Like many Jewish immigrants, Capin migrated more than once, going first from Lithuania to London with his family at age 12, then to New York at 18, then to Harrisburg, PA, where he met his wife Dora, then to Arizona, and then to New Mexico. In the small Southwest towns where the Capin family lived, tailors, many of them Jewish, often stocked their shelves with a variety of goods.

    The hatboxes, belts, shoe boxes, and ready-made jackets and shirts on display in the photograph indicate the variety of items available in the store, which also had fitting rooms for customers ordering custom-made clothing. Jewish immigrants frequently employ their relatives, as Capin apparently did with his son-in-law. The photograph shows how formally Capin was dressed, as befit the proprietor of the shop. Capin eventually parlayed his small shop into a formidable retail operation focused on department stores and dry goods, two areas of the economy in which many immigrant Jews found success.
  citation: '[Hyman Capin’s Tailor Shop in Columbus, NM](http://parentseyes.arizona.edu/bloom/jpgs/cap-colu2.jpg).
    c. 1919. From the Leona G. and David A. Bloom Southwest Jewish Archives.'
  image:
    url: /files/capin_hires.jpg
    alt: Capin’s Tailor Shop (1919)
    width: 562
