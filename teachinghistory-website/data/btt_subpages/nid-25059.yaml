- subpage: 7
  title: Primary Sources
  content: |-
    Library of Congress. [*From Haven to Home: 350 Years of Jewish Life in America*](http://www.loc.gov/exhibits/haventohome/). *This Library of Congress exhibit was originally organized to commemorate the 350th anniversary of Jewish settlement in America, usually dated to 1654. The online exhibit draws on a rich variety of sources from the Library of Congress and other repositories, including everything from sheet music to photographs to letters to pamphlets to periodicals. The documents are organized both chronologically and thematically to trace the major themes of the Jewish encounter with freedom in America and the continuous struggle of Jews in America to balance tradition with modernity.*

    PBS. [*The Jewish Americans*](http://www.pbs.org/jewishamericans/). *This six-hour documentary series traces Jewish life in America, with an emphasis on social and cultural history. The companion website includes historical documents, resources for educators and numerous video clips from the series on a variety of topics.*

    [*Jewish Women’s Archive*](http://jwa.org/). *This virtual archive is a treasure trove of information about Jewish women worldwide but is particularly strong on American Jewish women. The site includes an award-winning encyclopedia, online exhibits, historical documents of all kinds, educational materials and lesson plans, several blogs related to Jewish women’s history and Jewish feminism, book and film guides, and oral histories.*

    Nadell, Pamela S., ed. *American Jewish Women’s History: A Reader*. New York: NYU Press, 2003. *This edited collection brings together a combination of classic and recent essays on American Jewish women’s history, one of the most vibrant subfields of American Jewish history. Covering topics as diverse as Jewish women garment workers, modern dancers, and religious educators, the essays thoroughly demonstrate the central role women have played in the development of the diverse American Jewish community.*

    Wenger, Beth S. *The Jewish Americans: Three Centuries of Jewish Voices in America*. New York: Doubleday, 2007. *Wenger’s book is designed as a companion volume to the PBS documentary of the same name, but it goes much further. The beautifully designed and lavishly illustrated book contains numerous documents and provides a comprehensive narrative of American Jewish history that combines social, religious, economic, cultural, and political perspective.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Diner, Hasia R. *The Jews of the United States, 1654-2000*. Berkley and Los Angeles: University of California Press, 2004. *Diner’s academic synthesis of American Jewish history focuses on the history of Jewish people in America and the constant renegotiation of American Jewish identity. As one of the foremost scholars of American Jewish women, Diner is especially sensitive to gender in her analysis. As in her earlier work, she also sees more continuities than dissimilarities in Jewish migrant experiences over the period stretching from 1820 to 1924.*

    Raphael, Marc Lee, ed. *The Columbia History of Jews & Judaism in America*. New York: Columbia UP, 2008. *This edited collection brings together new essays on American Jewish history by a mix of junior and senior scholars. The first part of the book consists of chronological essays covering the sweep of American Jewish history. The second part includes thematic essays on topics as varied as Jewish education, Southern Jewish history, Holocaust consciousness, and American Jewish feminism.*

    Sarna, Jonathan D. *American Judaism: A History*. New Haven, CT: Yale UP, 2004. *One of the most distinguished historians of the American Jewish experience working today, Sarna uses the tools of religious history to analyze American Judaism from the colonial period to the present. He focuses on major themes in American Jewish history, including concerns about assimilation, reformation of synagogues and Jewish religious life, and Jewish continuity. The book comprehensively covers both religious leaders and the experiences of “ordinary” American Jews.*

    Weissbach, Lee Shai. *Jewish Life in Small-Town America: A History*. New Haven, CT: Yale UP, 2005. *Weissbach takes on the largely untold story of Jewish life in small-town America in this book, which reorients American Jewish history away from the large urban centers where much of it has centered. Familiar topics in American Jewish history, including intermarriage, congregational organization, and social life, look different when viewed from this angle. The book focuses on Jewish communities of less than 1000 people from the mid-19th century through World War II.*
