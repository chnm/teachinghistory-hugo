- subpage: 5
  title: '"Survival of the Fittest," Puck (1900)'
  annotation: Puck was a satirical political magazine which, typically, assumed that politics were the
    product of entrenched economic interests. For the cover of their March 1900 issue, the editors show
    the ultimate defeat of bimetallism in the United States. Two gladiators labeled "Gold Standard" and
    "Silver Standard" are pictured. Silver Standard's sword, labeled "16 to 1," lies broken at his side
    as Gold Standard stands victoriously over the fallen currency standard.
  citation: Dalrymple, Louis. Chromolithograph. "Survival of the Fittest." *Puck*, March 14, 1900.
  image:
    url: /files/Panic_Puckcartoon.jpg
    alt: '"Survival of the Fittest," Puck (1900)'
    width: 369
    height: 492
bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Andrews, Elisha Benjamin. ["An Honest Dollar."](http://books.google.com/books?id=D4PZAAAAMAAJ&printsec=frontcover&dq=An+Honest+Dollar&hl=en&ei=5ISbTbC2COO90QH38aGyAg&sa=X&oi=book_result&ct=result&resnum=1&ved=0CC8Q6AEwAA#v=onepage&q&f=false)  *The American Economic Association* 4:6 (1889). *Compilation of articles that provide an introductory lesson in bimetallist theory.*

    Giffen, Robert. [*The Case Against Bimetallism*](http://books.google.com/books?id=nUc5AAAAMAAJ&printsec=frontcover&dq=Giffen,+Robert+.+The+Case+against+Bimetallism&source=bl&ots=mq4YVOT7pl&sig=tHUDD2HDbxHMx0Ps2h-jen4slpA&hl=en&ei=b3ioTc3fBYfAtgfv7p3eBw&sa=X&oi=book_result&ct=result&resnum=2&ved=0CB8Q6AEwAQ#v=onepage&q&f=false). London: George Bell & Sons, 1892. *Contains several previously printed essays on bimetallism and argued against the use of bimetallism and those who had strayed from "sound monetary tradition." Giffen referred to bimetallists as "currency faddists."*

    Laughlin, James Laurence. [*History of Bimetallism in the United States*](http://books.google.com/books?id=kU_PAAAAMAAJ&printsec=frontcover&dq=Laughlin,+James+Laurence.+History+of+Bimetallism+in+the+United+States&source=bl&ots=-KULl2P60t&sig=F36ZVYLbT5a9CwHd-GOfay0r9cw&hl=en&ei=6nioTY3yN8y2tgel9b3dBw&sa=X&oi=book_result&ct=result&resnum=6&ved=0CEQQ6AEwBQ#v=onepage&q&f=false). New York: D. Appleton and Company, 1896. *Touches upon Giffen's theory, calling it fallacy, and discusses the purchasing power of both gold and silver and the history of the metals' uses in the United States and Europe as it related to the topic of bimetallism.*

    Mills, Roger Q. [“What Shall We Do with Silver?”](http://books.google.com/books?id=-1gCAAAAIAAJ&pg=PA572&lpg=PA572&dq=Mills,+Roger+Q.+“What+shall+we+do+with+silver?”+The+North+American+Review&source=bl&ots=NASINBK4QL&sig=V2yqVYF3rHJmcipQiBKYwDmYiMg&hl=en&ei=JXmoTfGyCImCtgfql-3fBw&sa=X&oi=book_result&ct=result&resnum=5&ved=0CDAQ6AEwBA#v=onepage&q&f=false) *The North American Review* 150:402 (1890). *Dry analysis of the usefulness of silver relative to the economy, which expresses the belief that the interchangeable nature of using gold and silver as a standard for the national currency would keep prices more stable.*

    Nicholson, Joseph Shield. [*A Treatise on Money and Essays on Monetary Problems*](http://books.google.com/books?id=d7AoAAAAYAAJ&printsec=frontcover&dq=Nicholson,+Joseph+Shield.+Money+and+Monetary+Problems&source=bl&ots=ve9zyR71C9&sig=0ylPFyNH3gqzE62AtfR4nfPr5Mg&hl=en&ei=YnmoTZSnGoyatwephIXeBw&sa=X&oi=book_result&ct=result&resnum=3&ved=0CCYQ6AEwAg#v=onepage&q&f=false). London: Adam and Charles Black, 1893. *Deals with international economy and how bimetallism affects price fluctuation and stability.*

    Price, Langford Lovell. [*Money and Its Relations to Prices*](http://books.google.com/books?id=SWc5AAAAMAAJ&printsec=frontcover&dq=Price,+Langford+Lovell.+Money+and+its+Relations+to+Prices&source=bl&ots=xaXXxED0y1&sig=ZhMjkL2sMeOy9cyApQ69LBrJoNQ&hl=en&ei=iHmoTa2ON8SUtwfagsXdBw&sa=X&oi=book_result&ct=result&resnum=3&ved=0CCcQ6AEwAg#v=onepage&q&f=false). London and New York: Swan Sonnenschein & Co., Limited, 1896.  *A collection of lectures delivered by the author, who was the Newmarch Lecturer in Statistics at University College, London.*

    Taussig, Frank William. [*The Silver Situation in the United States*](http://www.archive.org/details/silversituationi00taus). New York: G.P. Putnam's Sons, 1896. *Intricate exploration of silver standard, the use of gold, bimetallism, and the possible outcomes of the world economy.*

    Walker, Francis Amasa. [*International Bimetallism*](http://books.google.com/books?id=miYMAQAAIAAJ&printsec=frontcover&dq=Walker,+International+Bimetallism&source=bl&ots=NOMzppPbbm&sig=iIjIbB2ZkyIVYsZ9JhA_sW7ckJk&hl=en&ei=BHqoTYHgIseztweJwPjdBw&sa=X&oi=book_result&ct=result&resnum=1&ved=0CBcQ6AEwAA#v=onepage&q&f=false). New York: Henry Holt and Company, 1896. —— [*Money*](http://books.google.com/books?id=io8MAAAAYAAJ&printsec=frontcover&dq=Walker,+Money&source=bl&ots=ykx_O-HRiB&sig=5AvuyFj6-yDImkWqzdIKlsd6JYU&hl=en&ei=InqoTcy0L4GitgeXqOzcBw&sa=X&oi=book_result&ct=result&resnum=3&ved=0CCkQ6AEwAg#v=onepage&q&f=false). New York: Henry Holt and Company, 1883. *Walker hoped his work would be seen as instructional in dealing with the current economic crisis effectively. He believed restoring silver would alleviate the economic downturn.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Fels, Rendigs. ["American Business Cycles, 1865–79."](http://www.jstor.org/stable/1802106) *The American Economic Review* 41:3 (1951), 325–349. *Economic history dealing with the Panic of 1873 can be complex and filled with arcane jargon. This is not the case with Rendigs Fels's article, which was later included in his book *American Business Cycles* (University of North Carolina Press, 1959).*

    Friedman, Milton. ["The Crime of 1873](http://www.jstor.org/stable/2937754)." *Journal of Political Economy* 98:6 (1990): 1159–1194. ——["Bimetallism Revisited."](http://www.jstor.org/stable/1942723) *Journal of Economic Perspectives* 4 (1990): 85–104. *The influential economist and former chairman of the Federal Reserve Milton Friedman closely studied the Panic of 1873. While his writing is less accessible, his scholarship and analysis remain sharp.*

    Glasner, David; Cooley, Thomas F., eds. [*Business Cycles and Depressions: An Encyclopedia.*](http://books.google.com/books?id=e1ZEPd_pQnoC&printsec=frontcover&dq=Business+Cycles+and+Depressions:+an+encyclopedia&source=bl&ots=aNDnFWiDce&sig=CPoUCqRMoClv3JtlrioE3GKteAo&hl=en&ei=MUuTTdjfJsi-0QHkttTMBw&sa=X&oi=book_result&ct=result&resnum=2&ved=0CCcQ6AEwAQ#v=onepage&q&f=false) New York: Garland Publishing, 1997. *The single most comprehensive reference book on cycles and depressions, which offers a fuller treatment, as well as the long-term historical consequences, of many of the economic concepts introduced in this essay.*

    Lubetkin, M. John. [*Jay Cooke's Gamble: The Northern Pacific Railroad, the Sioux, and the Panic of 1873*](http://books.google.com/books?id=tgadjJsmTRwC&pg=PR15&dq=Jay+Cooke%E2%80%99s+Gamble:+The+Northern+Pacific+Railroad,+the+Sioux,+and+the+Panic+of+1873,+focused+on+construction+in+the+West&hl=en&ei=gUuTTbKyKqbJ0QHRvfTMBw&sa=X&oi=book_result&ct=result&resnum=1&ved=0CC0Q6AEwAA#v=onepage&q&f=false). Norman, OK: University of Oklahoma Press, 2006.  *Connects events on the American frontier to those on Wall Street.*

    Unger, Irwin. [*The Greenback Era: A Social and Political History of American Finance, 1865–1879*](http://quod.lib.umich.edu/cgi/t/text/text-idx?c=acls;idno=heb00696). New Jersey: Princeton UP, 1964. *Supplies a readable and substantial analysis of the origins and consequences of the crisis.*
