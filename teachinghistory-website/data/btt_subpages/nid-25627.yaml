primary_sources:
- subpage: 1
  title: '"Discourses Concerning Government" (1698)'
  annotation: This excerpt from Algernon Sydney 's Discourses Concerning Government (1698), written in
    the wake of the English Civil War, illustrates alternative sources for American revolutionary thought
    besides John Locke. Although Locke was an important source for ideas on equality and natural rights,
    other writers known as the Commonwealthmen, including Sydney, transmitted to the colonists important
    ideas about the nature of republican government and the need for vigilance and virtue against oppression.
  text: |-
    Excerpt from *Discourses Concerning Nations*:

    SECTION 31

    *The Liberties of Nations are from God and Nature, not from Kings.*

    WHATSOEVER is usually said in opposition to this, seems to proceed from a groundless conceit, that the liberties enjoy'd by nations arise from the concessions of princes. This point has been already treated: but being the foundation of the doctrine I oppose, it may not be amiss farther to examine how it can be possible for one man born under the same condition with the rest of mankind to have a right in himself that is not common to all others, till it be by them or a certain number of them conferred upon him; or how he can without the utmost absurdity be said to grant liberties and privileges to them who made him to be what he is. If I had to do with a man that sought after truth, I should think he had been led into this extravagant opinion by the terms ordinarily used in patents and charters granted to particular men; and not distinguishing between the proprietor and the dispenser, might think kings had given, as their own, that which they only distribute out of the publick treasury, and could have had nothing to distribute by parcels, if it had not been given to them in gross by the publick. But I need not use our author so gently. The perversity of his judgment, and obstinate hatred to truth is sufficient to draw him into the most absurd errors without any other inducement; and it were not charity, but folly to think he could have attributed in general to all princes, without any regard to the ways by which they attain to their power, such an authority as never justly belonged to any. This will be evident to all those who consider, that no man can confer upon others that which he has not in himself: If he be originally no more than they, he cannot grant to them or any of them more than they to him. In the 7th, 8th, 9th and subsequent sections of the first chapter, it has been proved that there is no resemblence between the paternal right, and the absolute power which he asserts in kings: that the right of a father, whatever it be, is only over his children; that this right is equally inherited by them all when he dies: that everyone cannot inherit dominion; for the right of one would be inconsistent with that of all others: that the right which is common to all is that which we call liberty, or exemption from dominion: that the first fathers of mankind after the Flood had not the exercise of regal power; and whatsoever they had was equally devolved to every one of their sons, as appears by the examples of Noah, Shem, Abraham, Isaac, Jacob, and their children: that the erection of Nimrod's kingdom was directly contrary to, and inconsistent with the paternal right, if there was any regality in it: that the other kingdoms of that time were of the same nature: that Nimrod not exceeding the age of threescore years when he built Babel, could not be the father of those that assisted him in that attempt: that if the seventy two kings, who, as our author says, went from Babylon upon the confusion of languages, were not the sons of Nimrod, he could not govern them by the right of a father; if they were, they must have been very young, and could not have children of their own to people the kingdoms they set up: that whose children soever they were, who out of a part of mankind did within a hundred and thirty two years after the flood, divide into so many kingdoms, they shewed that others in process of time might subdivide into as many as they pleased; and kingdoms multiplying in the space of four thousand years since the 72, in the same proportion they did in one hundred and thirty two years into seventy two, there would now be as many kings in the world as there are men; that is, no man could be subject to another: that this equality of right and exemption from the domination of any other is called liberty: that he who enjoys it cannot be deprived of it, unless by his own consent, or by force: that no one man can force a multitude, or if he did, it could confer no right upon him: that a multitude consenting to be governed by one man, doth confer upon him the power of governing them; the powers therefore that he has, are from them, and they who have all in themselves can receive nothing from him, who has no more than every one of them, till they do invest him with it. This is proved by sacred and profane histories. . . . This leads us necessarily to a conclusion, that all kingdoms are at the first erected by the consent of nations, and given to whom they please; or else all are set up by force, or some by force and some by consent: If any are set up by the consent of nations, those kings do not confer liberties upon those nations, but receive all from them, and the general proposition is false. . . .
  citation: Library of Congress. "[Radical British Writers Prepare the Way for Revolution](http://myloc.gov/Exhibitions/creatingtheus/DeclarationofIndependence/RevolutionoftheMind/ExhibitObjects/BritishWritersWayforRevolution.aspx)."
    *Creating the United States*. Accessed May 29, 2012.
- subpage: 2
  title: Teapot with Slogan, "Stamp Act Repeal'd" (1766)
  annotation: This object, made in Britain, is illustrative of the large numbers of consumer goods colonists
    purchased from England during the middle decades of the 18th century. It also shows how a consumer
    good could be politicized through the application of a political message. Ordinary people would have
    bought and used goods such as these, bringing the message of resistance right into their homes.
  citation: From Peabody Essex Museum. "[Teapot, Stamp Act Repeal'd, 1766]( http://www.pem.org/collections/2-american_art)."
    Accessed May 30, 2012.
  image:
    url: /files/teapot.jpg
    alt: Teapot with Slogan, "Stamp Act Repeal'd" (1766)
    width: 420
    height: 314
- subpage: 3
  title: Fairfax Resolves (1774)
  annotation: This document, written by a group of Fairfax County, VA, gentlemen that included George
    Washington and George Mason, expressed the basic grievances of the colonists after Parliament's passage
    of the Coercive Acts in 1774. The document demonstrates how the colonists' ideas of resistance originated
    at the local level and were then carried to the inter-colonial meeting in Philadelphia that became
    known as the First Continental Congress.
  text: |-
    At a general Meeting of the Freeholders and Inhabitants of the County of Fairfax on Monday the 18th day of July 1774, at the Court House, George Washington Esquire Chairman, and Robert Harrison Gent. Clerk of the said Meeting—

    1. Resolved that this Colony and Dominion of Virginia can not be considered as a conquered Country; and if it was, that the present Inhabitants are the Descendants not of the Conquered, but of the Conquerors.

    That the same was not setled at the national Expence of England, but at the private Expence of the Adventurers, our Ancestors, by solemn Compact with, and under the Auspices and Protection of the British Crown; upon which we are in every Respect as dependant, as the People of Great Britain, and in the same Manner subject to all his Majesty's just, legal, and constitutional Prerogatives. That our Ancestors, when they left their native Land, and setled in America, brought with them (even if the same had not been confirmed by Charters) the Civil- Constitution and Form of Government of the Country they came from; and were by the Laws of Nature and Nations, entitled to all it's Privileges, Immunities and Advantages; which have descended to us their Posterity, and ought of Right to be as fully enjoyed, as if we had still continued within the Realm of England.

    2. Resolved that the most important and valuable Part of the British Constitution, upon which it's very Existence depends, is the fundamental Principle of the People's being governed by no Laws, to which they have not given their Consent, by Representatives freely chosen by themselves; who are affected by the Laws they enact equally with their Constituents; to whom they are accountable, and whose Burthens they share; in which consists the Safety and Happiness of the Community: for if this Part of the Constitution was taken away, or materially altered, the Government must degenerate either into an absolute and despotic Monarchy, or a tyrannical Aristocracy, and the Freedom of the People be annihilated.

    3. Resolved therefore, as the Inhabitants of the american Colonies are not, and from their situation can not be represented in the British Parliament, that the legislative Power here can of Right be exercised only by {our} own Provincial Assemblys or Parliaments, subject to the Assent or Negative of the British Crown, to be declared within some proper limited Time. But as it was thought just and reasonable that the People of Great Britain shou'd reap Advantages from these Colonies adequate to the Protection they afforded them, the British Parliament have claimed and exercised the Power of regulating our Trade and Commerce, so as to restrain our importing from foreign Countrys, such Articles as they cou'd furnish us with, of their own Growth or Manufacture, or exporting to foreign Countrys such Articles and Portions of our Produce, as Great Britain stood in Need of, for her won Consumption or Manufactures. Such a Power directed with Wisdom and Moderation, seems necessary for the general Good of that great Body-politic of which we are a Part; altho' in some Degree repugnant to the Principles of the Constitution. Under this Idea our Ancestors submitted to it: the Experience of more than a Century, during the government of the reciprocal Benefits flowing from it produced mutual uninterrupted Harmony and Good- Will, between the Inhabitants of Great Britain and her Colonies; who during that long Period, always considered themselves as one and same People: and tho' such a Power is capable of Abuse, and in some Instances hath been stretched beyond the original Design and Institution. Yet to avoid Strife and Contention with our fellow-Subjects, and strongly impressed with the Experience of mutual Benefits, we always Chearfully acquiesced in it, while the entire Regulation of our internal Policy, and giving and granting our own Money were preserved to our own provincial Legislatures.

    4. Resolved that it is the Duty of these Colonies, on all Emergencies, to contribute, in Proportion to their Abilities, Situation and Circumstances, to the necessary Charge of supporting and defending the British Empire, of which they are Part; that while we are treated upon an equal Footing with our fellow Subjects, the Motives of Self-Interest and Preservation will be a sufficient Obligation; as was evident thro' the Course of the last War; and that no Argument can be fairly applyed to the British Parliament's taxing us, upon a Presumption that we shou'd refuse a just and reasonable Contribution, but will equally operate in Justification of the Executive-Power taxing the People of England, upon a Supposition of their Representatives refusing to grant the necessary Supplies.

    5. Resolved that the Claim lately assumed and exercised by the British Parliament, of making all such Laws as they think fit, to govern the People of these Colonies, and to extort from us our Money with out our Consent, is not only diametrically contrary to the first Principles of the Constitution, and the original Compacts by which we are dependant upon the British Crown and Government; but is totally incompatible with the Privileges of a free People, and the natural Rights of Mankind; will render our own Legislatures merely nominal and nugatory, and is calculated to reduce us from a State of Freedom and Happiness to Slavery and Misery.

    6. Resolved that Taxation and Representation are in their Nature inseperable; that the Right of withholding, or of giving and granting their own Money is the only effectual Security to a free People, against the Incroachments of Despotism and Tyranny; and that whenever they yield the One, they must quickly fall a Prey to the other.

    7. Resolved that the Powers over the People of America now claimed by the British House of Commons, in whose Election we have no Share, on whose Determinations we can have no Influence, whose Information mush be always defective and often false, who in many Instances may have a seperate, and in some an opposite Interest to ours, and who are removed from those Impressions of tenderness and compassion arising from personal intercourse and Connections, which soften the Rigours of the most despotic Governments, must if continued, establish the most grievous and intollerable Species of Tyranny and Oppression, that ever was inflicted upon Mankind.

    8. Resolved that it is our greatest Wish and Inclination, as well as Interest, to continue our Connection with, and Dependance upon the British Government; but tho' we are it's Subjects, we will use every Means which Heaven hath given us to prevent our becoming it's Slaves.

    9. Resolved that there is a premeditated Design and System, formed and pursued by the British Ministry, to introduce an arbitrary Government into his Majesty's American Diminions; to which End they are artfully prejudicing our Sovereign, and inflaming the Minds of our fellow-Subjects in Great Britain, by propagating the most malevolent Falsehoods; particularly that there is an Intention in the American Colonies to set up for independant States; endeavouring at the same Time, by various Acts of Violence and Oppression, by sudden and repeated Dissolutions of our Assemblies, whenever they presume to examine the Illegality of ministerial Mandates, or deliberate on the violated Rights of their Constituents, and by breaking in upon the American Charters, to reduce us to a State of Desperation, and dissolve the original Compacts by which our Ancestors bound themselves and their Posterity to remain dependant upon the British Crown: which Measures, unless effectually counteracted, will end in the Ruin both of Great Britain and her Colonies.

    10. Resolved that the several Acts of Parliament for raising a Revenue upon the People of America without their Consent, the creating new and dangerous Jurisdictions here, the taking away our Trials by Jurys, the ordering Persons upon Criminal Accusations, to be tried in another Country than that in which the Fact is charged to have been committed, the Act inflicting ministerial Vengeance upon the Town of Boston, and the two Bills lately brought into Parliament for abrogating the Charter of the Province of Massachusetts Bay, and for the Protection and Encouragement of Murderers in the said Province, are Part of the above mentioned iniquitous System. That the Inhabitants of the Town of Boston are now suffering in the common Cause of all British America, and are justly entitled to it's Support and Assistance; and therefore that a Subscription ought imediatly to be opened, and proper Persons appointed, in every County of this Colony to purchase Provisions, and consign them to some Gentleman of Character in Boston, to be distributed among the poorer Sort of People there.

    11. Resolved that we will cordially join with our Friends and Brethren of this and the other Colonies, in such Measures as shall be judged most effectual for procuring Redress of our Grievances, and that upon obtaining such Redress if the Destruction of the Tea at Boston be regarded as an Invasion of private Property, we shall be willing to contribute towards paying the East India Company the Value: but as we consider the said Company as the Tools and Instrument of Oppression in the Hands of Government and the Cause of our present Distress, it is the Opinion of this Meeting that the People of these Colonies shou'd forbear all further Dealings with them, by refusing to purchase their Merchandize, until that Peace Safety and Good- order, which they have disturbed, be perfectly restored. And that all Tea now in this Colony, or which shall be imported into it shiped before the first Day of September next, shou'd be deposited in some Store-house to be appointed by the respective Committees of each County, until a sufficient Sum of Money be raised by Subscription to reimburse the Owners the Value, and then to be publickly burn'd and destroyed; and if the same is not paid for and destroyed as aforesaid, that it remain in the Custody of the said Committees, at the Risque of the Owners, until the Act of Parliament imposing a Duty upon Tea for raising a Revenue in America be repealed; and imediatly afterwards be delivered unto the several Proprietors thereof, their Agents or Attorneys.

    12. Resolved that Nothing will so much contribute to defeat the pernicious Designs of the common Enemies of Great Britain and her Colonies as a firm Union of the latter; who ought to regard every Act of Violence or Oppression inflicted upon any one of them, as aimed at all; and to effect this desireable Purpose, that a Congress shou'd be appointed, to consist of Deputies from all the Colonies, to concert a general and uniform Plan for the Defence and Preservation of our common Rights, and continueing the Connection and Dependance of the said Colonies upon Great Britain under a just, lenient, permanent, and constitutional Form of Government.

    13. Resolved that our most sincere and cordial Thanks be given to the Patrons and Friends of Liberty in Great Britain, for their spirited and patriotick Conduct in Support of our constitutional Rights and Privileges, and their generous Efforts to prevent the present Distress and Calamity of America.

    14. Resolved that every little jarring Interest and Dispute, which has ever happened between these Colonies, shou'd be buried in eternal Oblivion; that all Manner of Luxury and Extravagance ought imediatly to be laid aside, as totally inconsistent with the threatening and gloomy Prospect before us; that it is the indispensable Duty of all the Gentlemen and Men of Fortune to set Examples of Temperance, Fortitude, Frugality and Industry; and give every Encouragement in their Power, particularly by Subscriptions and Premiums, to the Improvement of Arts and Manufactures in America; that great Care and Attention shou'd be had to the Cultivation of Flax, Cotton, and other Materials for Manufactures; and we recommend it to such of the Inhabitants who have large Stocks of Sheep, to sell to their Neighbors at a moderate Price, as the most certain Means of speedily increasing our Breed of Sheep, and Quantity of Wool.

    15. Resolved that until American Grievances be redressed, by Restoration of our just Rights and Privileges, no Goods or Merchandize whatsoever ought to be imported into this Colony, which shall be shiped from Great Britain or Ireland after the first Day of September next, except Linnens not exceeding fifteen Pence {per} yard, coarse woolen Cloth, not exceeding two Shillings sterling {per} Yard, Nails Wire, and Wire-Cards, Needles & Pins, Paper, Salt Petre, and Medecines; which may {which three Articles only may} be imported until the first Day of September, one thousand seven hundred and seventy six; and if any Goods or Merchandize, othe[r] than those hereby excepted, shou'd be ship'd from Great Britain, {or Ireland} after the time aforesaid, to this Colony, that the same, immediately upon their Arrival, shou'd either be sent back again, by the Owners their Agents or Attorn[ey]s, or stored and deposited in some Ware- house, to be appointed by the Committee for each respective County, and there kept, at the Risque and Charge of the Owners, to be delivered to them, when a free Importation of Goods hither shall again take Place. And that the Merchants and Venders of Goods and Merchandize within this Colony ought not to take Advantage of our present Distress b[u]t continue to sell the Goods and Merchandize which they now have, or which may be shiped to them before the first Day of September next, at the same Rates and Prices they have been accustomed to do, within one Year last past; and if any Person shall sell such Goods on any other Terms than above expressed, that no Inhabitant of this Colony shou'd at any time, for ever thereafter, deal with him, his Agent, Factor, or Store keepers for any Commodity whatsoever.

    16. Resolved that it is the Opinion of this Meeting, that the Merchants and Venders of Goods and Merchandize within this Colony shou'd take an Oath, not to sell or dispose of any Goods or Merchandize whatsoever, which may be shiped from Great Britain {or Ireland} after the first Day of September next as aforesaid, except the {three} Articles before excepted, and that they will, upon Receipt of such prohibited Goods, either send the same back again by the first Opportunity, or deliver them to the Committees in the respective Countys, to be deposited in some Warehouse, at the Risque and Charge of the Owners, until they, their Agents or Factors be permitted to take them away by the said Committees: the Names of those who refuse to take such Oath to be advertized by the respective Committees in the Countys wherein they reside., And to the End that the Inhabitants of this Colony may know what Merchants, and Venders of Goods and Merchandize have taken such Oath, that the respective Committees shou'd grant a Certificate thereof to every such Person who shall take the same.

    17. Resolved that it is the Opinion of this Meeting, that during our present Difficulties and Distress, no Slaves ought to be imported into any of the British Colonies on this Continent; and we take this Opportunity of declaring our most earnest Wishes to see an entire Stop for ever put to such a wicked cruel and unnatural Trade.

    18. Resolved that no kind of Lumber shou'd be exported from this Colony to the West Indies, until America be restored to her constitutional Rights and Liberties if the other Colonies will accede to a like Resolution; and that it be recommended to the general Congress to appoint as early a Day as possible for stopping such Export.

    19. Resolved that it is the Opinion of this Meeting, if American Grievances be not redressed before the first Day of November one thousand seven hundred and seventy five, that all Exports of Produce from the several Colonies to Great Britain {or Ireland} shou'd cease; and to carry the said Resolution more effectually into Execution, that we will not plant or cultivate any Tobacco, after the Crop now growing; provided the same Measure shall be adopted by the other Colonies on this Continent, as well those who have heretofore made Tobacco, as those who have n[o]t. And it is our Opinion also, if the Congress of Deputies from the several Colonies shall adopt the Measure of Non- exportation to Great Britain, as the People will be thereby disabled from paying their Debts, that no Judgements shou'd be rendered by the Courts in the said Colonies for any Debt, after Information of the said Measure's being determined upon.

    20. Resolved that it is the Opinion of this Meeting that a solemn Covenant and Association shou'd be entered into by the Inhabitants of all the Colonies upon Oath, that they will not, after the Times which shall be respectively agreed on at the general Congress, export any Manner of Lumber to the West Indies, nor any of their Produce to Great Britain {or Ireland}, or sell or dispose of the same to any Person who shall not have entered into the said Covenant and Association; and also that they will no import or receive any Goods or Merchandize which shall be ship'd from Great Britain {or Ireland} after the first Day of September next, other than the before enumerated Articles, nor buy or purchase any Goods, except as before excepted, of any Person whatsoever, who shall not have taken the Oath herein before recommended to be taken by the Merchants and Venders of Goods nor buy or purchase any Slaves hereafter imported into any Part of this Continent until a free Exportation and Importation be again resolved on by a Majority of the Representatives or Deputies of the Colonies. And that the respective Committees of the Countys, in each Colony so soon as the Covenant and Association becomes general, publich by Advertisements in their several Counties {and Gazettes of their Colonies}, a List of the Names of those (if any such there be) who will not accede thereto; that such Traitors to their Country may be publickly known and detested.

    21. Resolved that it is the Opinion of this Meeting, that this and the other associating Colonies shou'd break off all Trade, Intercourse, and Dealings, with that Colony Province or Town which shall decline or refuse to agree to the Plan which shall be adopted by the general Congress.

    22. Resolved that shou'd the Town of Boston be forced to submit to the late cruel and oppressive Measures of Government, that we shall not hold the same to be binding upon us, but will, notwithstanding , religiously maintain, and inviolably adhere to such Measures as shall be concerted by the general Congress, for the preservation of our Lives Liberties and Fortunes.

    23. Resolved that it be recommended to the Deputies of the general Congress to draw up and transmit an humble and dutiful Petition and Remonstrance to his Majesty, asserting with decent Firmness our just and constitutional Rights and Privileg[es,] lamenting the fatal Necessity of being compelled to enter into Measur[es] disgusting to his Majesty and his Parliament, or injurious to our fellow Subjects in Great Britain; declaring, in the strongest Terms, ou[r] Duty and Affection to his Majesty's Person, Family [an]d Government, and our Desire to continue our Dependance upon Great Bri[tai]n; and most humbly conjuring and besecching his Majesty, not to reduce his faithful Subjects of America to a State of desperation, and to reflect, that from our Sovereign there can be but one Appeal. And it is the Opinion of this Meeting, that after such Petition and Remonstrance shall have been presented to his Majesty, the same shou'd be printed in the public Papers, in all the principal Towns in Great Britain.

    24. Resolved that George Washington Esquire, and George Broadwater Gent. lately elected our Representatives to serve in the general Assembly, be appointed to attend the Convention at Williamsburg on the first Day of August next, and present these Resolves, as the Sense of the People of this County, upon the Measures proper to be taken in the present alarming and dangerous Situation of America.
  citation: From Gunston Hall. "[Fairfax County Resolves (July 18, 1774)]( http://gunstonhall.org/georgemason/human_rights/fairfax_resolves.html)."
    Accessed May 30, 2012.
- subpage: 4
  title: '"A Society of Patriotic Ladies" (1775)'
  annotation: This political cartoon, published in London, satirizes the actions of the women of Edenton,
    NC, who in 1774 gathered together to sign a document supporting the Continental Congress's boycott
    of British goods. The image reveals both the active participation of women in political activities
    prior to the American Revolution and the hostility that women's political participation provoked in
    some quarters, in England as well as America.
  citation: From the Library of Congress. "[A Society of Patriotic Ladies, at Edenton in North Carolina](
    http://hdl.loc.gov/loc.pnp/ppmsca.19468)." Accessed May 30, 2012.
  image:
    url: /files/ladies.jpg
    alt: '"A Society of Patriotic Ladies" (1775)'
    width: 351
    height: 476
- subpage: 5
  title: Petition by African American Slaves to the Massachusetts Council and House of Representatives
    (1777)
  annotation: This document demonstrates the extent to which some enslaved African Americans identified
    with the revolutionary cause. These enslaved people adopted many of the same sentiments as white colonists
    in their struggle against Great Britain, and even employed some of the same language as the Declaration
    of Independence in demanding their freedom from slavery.
  text: |-
    To the Honorable Counsel & House of [Representa-]tives for the State of Massachusette Bay in General Court assembled, Jan 13 1777—

    The petition of A Great Number of Blackes detained in a State of Slavery in the Bowels of a free & christian Country Humbly shuwith that your Petitioners Apprehend that Thay have in Common with all other men a Natural and Unaliable Right to that freedom which the Grat - Parent of the Unavese hath Bestowed equalley on all menkind and which they have Never forfuted by Any Compact or Agreement whatever — but thay wher Unjustly Dragged by the hand of cruel Power from their Derest frinds and sum of them Even torn from the Embraces of their tender Parents — from A popolous Plasant And plentiful cuntry And in Violation of Laws of Nature and off Nations And in defiance of all the tender feelings of humanity Brough hear Either to Be sold Like Beast of Burthen & Like them Condemnd to Slavery for Life — among A People Profesing the [mild?] Religion of Jesus A people Not Insensible of the Secrets of Rationable Being Nor without spirit to Resent the unjust endeavours of others to Reduce them to A state of Bondage and Subjection your honouer Need not to be informed that A Life of Slavery Like that of your Petioners Deprived of Every social Priviledge of Every thing Requiset to Render Life Tolable is far [ . . . ] worse then Nonexistance.

    [In imita ]tion of [the] Lawdable Example of the Good People of these States your petiononers have Long and Patiently waited the Evnt of petition after petition By them presented to the Legislative Body of this state And cannot but with Grief Reflect that their Sucess hath ben but too similar they Cannot but express their Astonisments that It has Never Bin Consirdered that Every Principle from which Amarica has Acted in the Cours Of their unhappy Deficultes with Great Briton Pleads Stronger than A thousand arguments in favowrs of Your petioners thay therfor humble Beseech your Honours to give this petion its due weight & consider-ration and cause an act of the Legislatur to be past Wherby they may Be Restored to the Enjoyments of that Which is the Naturel Right of all men — and their — Children who wher Born in this Land of Liberty may not be heald as Slaves after they arive at the age of Twenty one years so may the Inhabitance of thes State No longer chargeable with the inconsistancey of acting themselves the part which thay condem and oppose in Others Be prospered in their present Glorious Struggle for Liberty and have those Blessing to them &c.
  citation: From the Massachusetts Historical Society. "[Petition for freedom to the Massachusetts Council
    and the House of Representatives, January 1777]( http://masshist.org/database/597use-onview-id)."
    Accessed May 30, 2012.
bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Gilder Lehrman Institute of American History. *[American Revolution, 1763-1783](http://gilderlehrman.org/collections/groupings/american-revolution-1763-1783)*.  *This is an excellent collection of documents drawn from the Gilder Lehrman Collection that discusses the experience of American leaders and ordinary people who lived through the American Revolution.*

    Yale Law School. *[The Avalon Project](http://avalon.law.yale.edu/subject_menus/18th.asp)*.  *This site provides a comprehensive compilation of political documents relating to the colonial period and American Revolution.*

    Massachusetts Historical Society. *[The Coming of the American Revolution](http://masshist.org/revolution/)*.  *This is a superb website that contains a number of primary sources, relating to both social and political history, drawn from the Massachusetts Historical Society Collection.*

    Library of Congress. *[Creating the Declaration of Independence](http://myloc.gov/Exhibitions/creatingtheus/DeclarationofIndependence/Pages/default.aspx)*.  *This site contains an excellent and varied selection of primary sources that provide the political context for the coming of the American Revolution and the writing of the Declaration of Independence.*

    Library of Congress. *[Religion and the Founding of the American Republic](http://www.loc.gov/exhibits/religion/)*.  *Using primary sources, this site provides a thorough examination of the religious dimensions of the American Revolution.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Berlin, Ira. *Many Thousands Gone: The First Two Centuries of Slavery in North America*. Cambridge: Harvard University Press, 1998.  *A sweeping examination of the institution of slavery and the lives of enslaved people from early colonization into the 19th century.*

    Breen, T.H. *The Marketplace of Revolution: How Consumer Politics Shaped American Independence*. New York: Oxford University Press, 2004.  *An important study that examines the ways in which consumer goods brought ordinary men and women into the revolutionary movement.*

    Morgan, Edmund S. *American Slavery, American Freedom: The Ordeal of Colonial Virginia*. New York: W.W. Norton & Co., 1975.  *A classic work that highlights the central contradiction of the American Revolution: freedom for white people and slavery for black people.*

    Nash, Garry. *The Unknown American Revolution: The Unruly Birth of Democracy and the Struggle to Create America*. New York: Viking Press, 2005.  *A masterful synthesis that shows the limitations as well as the achievements of the American Revolution, especially for poor white men, women, and enslaved people.*

    Wood, Gordon S. *The Radicalism of the American Revolution*. New York: Vintage Books, 1993.  *A classic work that traces the social and political transformations of American society resulting from the American Revolution.*

    Young, Alfred F. and Nobles, Gregory H. *Whose American Revolution Was It? Historians Interpret the Founding*. New York: New York University Press, 2011.  *An excellent overview that examines changing scholarly views of the American Revolution from the early 20th century to the early 21st century.*
