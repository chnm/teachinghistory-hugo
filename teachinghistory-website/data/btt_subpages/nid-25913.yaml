- subpage: 8
  title: Secondary Sources
  content: "Fred Anderson, *The War That Made America: A Short History of the French and Indian War* (2005)\
    \  \nA short scholarly book on the French and Indian war that provides excellent context to the conditions\
    \ that precipitated the American Revolution.\n\nBrooke Bauer, *Becoming Catawba: Catawba Indian Women\
    \ and Nation-Building, 1540–1840* (2022)  \nBauer (Catawba) focuses on the Native people of the Carolina\
    \ Piedmont over from Catawba speaking groups to the formation of a Catawba nation. In particular,\
    \ Bauer explores the work Catawba Women did to maintain the kinship networks that formed the nation\
    \ and held it together. Women were crucial in responding to the war, disease, and poverty brought\
    \ about by the War for Independence and its aftermath.\n\nNed Blackhawk, “How Native Nations Shaped\
    \ the Revolution,” *The Atlantic* (October 9, 2025)   \nIn this article, historian Ned Blackhawk (Te-Moak\
    \ Tribe of Western Shoshone) uses the 250th anniversary of the Declaration to note how Native peoples\
    \ are often left out of standard narratives about the Revolution and argues for a reframing that puts\
    \ them at the center.\n\nColin G. Calloway, *The American Revolution in Indian Country: Crisis and\
    \ Diversity* (1995)  \nA key early scholarly effort to reframe the role of Native Americans during\
    \ the Revolutionary Era. Calloway looks at eight communities and shows how initially these groups\
    \ pursued a tack of neutrality, but all eventually decided to shift to taking sides as the conflict\
    \ spread west.\n\nVine Deloria, Jr., “The American Revolution and the American Indian: Problems in\
    \ the Recovery of a Usable Past.” *In Spirit & Reason: The Vine Deloria, Jr. Reader*. Edited by Vine\
    \ Deloria Jr., 206–222. (1999)  \nNative scholar Deloria’s landmark critique of the whitewashing of\
    \ U.S. history and exclusion of Native voices.\n\nKathleen DuVal, *Independence Lost: Lives on the\
    \ Edge of the American Revolution* (2016)  \nDuVal examines a variety of actors in the Revolutionary\
    \ Era who pursued goals that ranged from “independence” to “advantageous interdependence” arrangements\
    \ that often involved the dependence of other groups. Under this framework, the British North American\
    \ colonists rebelled and coalesced into a constitutional order that laid the groundwork to dominate\
    \ the nineteenth-century west.\n\nElizabeth Ellis, *The Great Power of Small Nations: Indigenous Diplomacy\
    \ in the Gulf South* (2022)\n\nSamuel Fisher, “Fit Instruments in a Howling Wilderness: Colonists,\
    \ Indians, and the Origin of the American Revolution.” *William and Mary Quarterly* 73.4 (2016): 647–680.\
    \  \nRevolutionary era historiography overview.\n\nMaeve Kane, *Shirts Powdered Red: Haudenosaunee\
    \ Gender, Trade, and Exchange across Three Centuries* (2023)\n\nFullagar, Kate, and Michael McDonnell,\
    \ eds. *Facing Empire: Indigenous Experiences in a Revolutionary Age* (2018)  \nA global look at the\
    \ Revolution that emphasizes Indigenous agency in exploiting the changes of the era to push for their\
    \ own independence.\n\nMichael A. McDonnell, *Masters of Empire: Great Lakes Indians and the Making\
    \ of America* (2015)\n\nJane T. Merritt, “Native Peoples in the Revolutionary War,” in *Oxford Handbook\
    \ of the American Revolution* (2012) edited by Edward G. Gray and Jane Kamensky pp. 250–70. DOI: 10.1093/oxfordhb/9780199746705.013.0015\
    \  \nBrief but highly useful overview of Native perspective on the Revolution.\n\nKristofer Ray, “The\
    \ Indigenous Roots of the American Revolution.” In *The Oxford Research Encyclopedia of American History*.\
    \ Edited by Jon Butler and Angela Hudson (2020)\n\nGreg O’Brien, *Choctaws in a Revolutionary Age,\
    \ 1750-1830 (Indians of the Southeast)* (2005)\n\nClaudio Saunt, *West of the Revolution: An Uncommon\
    \ History of 1776* (2014)\n\nEthan Schmidt, *Native Americans in the American Revolution: How the\
    \ War Divided, Devastated, and Transformed the Early American Indian World* (2014)\n\nAlan Taylor,\
    \ *American Revolutions: A Continental History, 1750–1804* (2016)\n\nKarim M. Tiro, *The People of\
    \ the Standing Stone: The Oneida Nation from the Revolution through the Era of Removal* (2011)"
