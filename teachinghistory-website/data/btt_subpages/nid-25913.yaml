- subpage: 3
  title: '"Map of New France" 1755'
  annotation: This map from 1755 shows “Nouvelle France” (New France or Canada). As students examine it
    in conjunction with the other maps listed below they can see the course of the French and Indian War
    which resulted in the colony being brought under the control of the British Empire. The map also reveals
    much about the interactions between the various Native peoples who occupied much of the land and the
    French colonizers. While the text is in French students should be able to decipher many of the terms.
  citation: Partie occidentale de la Nouvelle France ou Canada, 1755, Library of Congress <https://www.loc.gov/item/73695755/>
  image:
    url: /files/NewFranceMap.jpg
    alt: '"Map of New France" 1755'
    width: 934
    height: 745
- subpage: 4
  title: “Map of British Forces in North America” (1766)
  annotation: This map shows the British North American colonies in 1766 along with the locations of British
    troops. Students should think about why and for whom the map was created. Take note of the large swath
    of land marked as “Land Reserved for the Indians”. This represents the Proclamation Line of 1763 which
    forbade colonists in British North America from settling west of the line as part of the settlement
    to end the French and Indian War. The line is a specific grievance against King George III in the
    Declaration of Independence.
  citation: “Cantonment of His Majesty's forces,” March 1766, Library of Congress <https://www.loc.gov/item/gm72002042/>
  image:
    url: /files/BritishTroopsMap.jpg
    alt: “Map of British Forces in North America” (1766)
    width: 949
    height: 793
- subpage: 5
  title: “Map of the middle British colonies in America” (1771)
  annotation: This map from 1771 notes the locations of various Native groups and also conveys the different
    economic activities such as beaver trapping and deer hunting that different peoples engaged in. Students
    can compare this map to the 1755 French map to see if they notice any similarities and differences.
  citation: “A general map of the middle British colonies in America,” 1771 Library of Congress https://www.loc.gov/item/74694156/
  image:
    url: /files/BritishColoniesMap.jpg
    alt: “Map of the middle British colonies in America” (1771)
    width: 973
    height: 745
