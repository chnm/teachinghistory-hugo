- subpage: 1
  title: Catawba Map (1721)
  annotation: Although predating the Revolutionary Crisis by several decades, this map is one of the few
    surviving maps from the colonial period that were originally created by Native Americans. Copied by
    South Carolina officials based on a map presented to the governor by Catawba Indians, the map can
    be read as a diplomatic tool designed to communicate to the British overall structure of local trade
    networks. The map also shows that conquest and expansion of Native Americans by European colonists
    was not inevitable as diplomacy and trade were, in this earlier period, an important basis for interaction
    between Native Americans and colonists. For further information on the map see this [informative blog
    post](https://blogs.loc.gov/maps/2016/11/celebrating-native-american-cartography-the-catawba-deerskin-map/)
    on the Library of Congress website.
  citation: '[Map of the several nations of Indians to the Northwest of South Carolina], 1721, Library
    of Congress <https://www.loc.gov/item/2005625337>'
  image:
    url: /files/CatawbaMap.jpg
    alt: Catawba Map (1721)
    width: 3539
    height: 2433
- subpage: 2
  title: “Claims of Delaware Indians” (1910)
  annotation: This report from 1910 was presented in support of a bill in the U.S. Senate (S. 6940) to
    compensate the Delaware Indians for their service in various U.S wars including the Revolutionary
    War. Note first the year, 1910, demonstrating that Native Americans like the Delaware were actively
    pursuing claims against the U.S. government over a century after the end of the Revolutionary War.
    The document also contains a list of both how the Delaware assisted the Patriots in the struggle for
    independence and how American treaties and promises to the Delaware have been broken.
  text: |-
    Senate 61st Congress 2d Session Document No. 483

    CLAIMS OF DELAWARE INDIANS

    Mr. GORE presented the following MEMORIAL OF THE DELAWARE INDIANS, KNOWN AS THE " HEAD OF THE ALGONQUIN CONFEDERATION," IN SUPPORT OF A BILL (s. 6940) TO COMPENSATE THE DELAWARE INDIANS FOR SERVICES RENDERED BY THEM TO THE UNITED STATES IN VARIOUS WARS.

    APRIL 11, 1910.—Referred to the Committee on Indian Affairs and ordered to be printed.

    MEMORIAL OF THE DELAWARE INDIANS. [In re S. 6940 and H. R. 22069.]

    To the Congress of the United States: The purpose of this bill is to compensate the Delaware Indians for services rendered by them to the United States in various wars. Your memorialists represent-- That the Delaware Indians, known as the " head of the Algonquin Confederation," furnished, as soldiers and allies in the various wars prior to 1855, more than 1,500 warriors, and from smallpox contracted in the war of the Revolution and the war of 1812 lost .more than 15,000 of their people; smallpox was a disease unknown among Indians prior to the advent of the white man. That the Delaware Indians were the first people to come to the aid of the colonists in their struggle for independence. That the first treaty this Government made with any nation or people was made with the Delaware Indians. That in that treaty the Delawares, as a nation, formed an offensive and defensive alliance with this Government.

    That they were to be recognized as the head of an Indian State with representation in Congress as part of their compensation. That the Delaware Indians carried out their part of these treaty obligations, did furnish warriors and use their influence with other tribes in the interests of the United States, did give free access across their territory to the Revolutionary troops, did consent to have farts built on their property, did assist in the building of these forts, lid act as spies and scouts and guides and furnish information to the Government as to the strength, position, and purpose of the enemy, and did receive nothing in return therefor. That few, if any, of the promises made to them by the Government have ever been fulfilled. That when their assistance was no longer needed they were insulted and outraged. That finally, to avoid trouble, they gave up the territory which had been solemnly pledged to them forever , to become the fourteenth State in the Union. That thereupon, relying on this Government and its promises contained in' the treaty of 1804, they removed farther west into what is now Indiana. That then came the war of 1812, and the Delaware Indians again came to the assistance of the Government and rendered it invaluable aid. That the soldiers who passed through this new territory (Indiana) saw and praised the value of this new land and coveted it. That finally, by coercion and persuasion, the Delawares were again induced to give up this land to the United States and move farther west. That the services they rendered were in conflicts that were not theirs and in wars for which they were not responsible. That they gave their blood and their land and were reduced in less than two generations from over 20,000 people to less than 4,000. That still they remained loyal to this Government and assisted in the wars that followed, including the various Indian wars, the Florida war, the Mexican war, and the civil war.

    That the services they rendered and the promises made to them entitled them to expect the friendship, consideration, and gratitude of this Government. That all of these services have been rendered with- out compensation or pay. That not even a statue has been erected to them or to any of their warriors who fell in the cause of this Government. That, as Indian Commissioner Manypenny says' no people, State, or community has ever done so much or submitted to such injustice and ingratitude without revolt. That the French allies' who had a great grievance against the English and who were really fighting on their own account and for their own ends were liberally rewarded by this Government. That all other soldiers who have served this Government in its early wars received pay and bounties under laws made to meet their ,cases, but which are inapplicable to these Indians. That the Delawares have now been stripped of practically all of their lands and are now reduced to less than 1,500 people.

    That they how make claim for the bounties to the same amount and to tit4 same extent as under existing laws would be given to other soldiers in like circumstances, the only difference being that inasmuch as the Delawares furnished their warriors as a tribe they ask that the bounties be issued to them as a tribe to be distributed by them in accordance with their traditional customs. That the Delawares are justly entitled to many times the compensation they are seeking to obtain by H. R. 22069, as will more fully appear herein.
  citation: “Claims of Delaware Indians,” Presented to the Committee on Indian Affairs, 1910, Library
    of Congress https://www.loc.gov/item/10035574/
