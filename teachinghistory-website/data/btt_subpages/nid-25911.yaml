- subpage: 7
  title: Primary Sources
  content: "Library of Congress, [*The Two Georges: Parallel Lives in an Age of Revolution*](https://www.loc.gov/exhibitions/two-georges/about-this-exhibition/)\
    \  \nThis exhibit from the Library of Congress brings together three extraordinary collections — George\
    \ Washington’s papers from the Library of Congress, George III’s scientific instruments from the Science\
    \ Museum Group in London, and George III’s papers from the Royal Collection and Royal Archives. They\
    \ reveal their shared interests in science and agriculture and illuminate how they approached the\
    \ challenges of their time, including war, slavery, politics, and the pressures of public life. Included\
    \ in this collection is Lord Dunmore’s 1775 proclamation that promised freedom to all indentured servants\
    \ and enslaved to those in rebellion against Great Britain."
