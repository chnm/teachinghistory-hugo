primary_sources:
- subpage: 1
  title: '"Lord Dunmore''s Proclamation" (1775)'
  annotation: Lord Dunmore’s 1775 proclamation promised freedom to all indentured servants and enslaved
    under those in rebellion against Great Britain. Students can read through the document, which is relatively
    short, to understand Dunmore’s justification for the proclamation. Students should know that this
    proclamation and similar orders from colonial governors led to escape and self-emancipation of almost
    100,000 individuals that included men, women, and children. Teachers may want to furnish students
    with both the hand written document and a transcript for easier reading.
  text: |-
    By his Excellency the Right Honourable John Earl of Dunmore, his Majesty's Lieutenant and Governor-General of the Colony and Dominion of Virginia, and Vice-admiral of the same.

    A PROCLAMATION.

    As I have ever entertained hopes that an accommodation might have taken place between *Great-Britain* and this colony, without being compelled, *by my duty*, to this most disagreeable, but now absolutely necessary step, rendered so by a body of armed men, unlawfully assembled, firing on his Majesty’s tenders, and the formation of an army, and that army now on their march to attack his Majesty’s troops, and destroy the well disposed subjects of this colony: To defeat such treasonable purposes, and that all such traitors, and their abetters, may be brought to justice, and that the peace and good order of this colony may be again restored, which the ordinary course of the civil law is unable to effect, I have thought fit to issue this my proclamation, hereby declaring, that until the aforesaid good purposes can be obtained, I do, in virtue of the power and authority to me given, *by his Majesty*, determine to execute martial law, and cause the same to be executed throughout this colony; and to the end that *peace* and *good order* may the sooner be restored, I do require every person capable of bearing arms to resort to his Majesty’s STANDARD, or be looked upon as traitors to his Majesty’s crown and government, and thereby become liable to the penalty the law inflicts upon such offences, *such as forfeiture of life*, *confiscation of lands*, &c. &c. And I do hereby farther declare all *indented servants*, *Negroes*, or others (appertaining to rebels) *free*, that are able and willing to bear arms, they *joining his Majesty’s troops*, as soon as may be, for the more speedily reducing this Colony to a *proper sense* of their duty, to his Majesty’s crown and dignity. I do father order, and require all his Majesty’s liege subjects to retain their quitrents, or any other taxes due, or that may become due, in their own custody, till such time as peace may be again restored to this at present most unhappy country, or demanded of them for their former salutary purposes, by officers properly authorized to receive the same.

    *Given on board the ship* William, off Norfolk, *the 7th of* Nov.

    LORD DUNMORE

    God Save the King
  citation: Murray, John (Lord Dunmore). "Dunmore's Proclamation, November 7, 1775." Printed Ephemera
    Collection, Portfolio 178, Folder 18, Rare Book and Special Collections Division, Library of Congress.
    https://www.loc.gov/item/2020769134/
- subpage: 2
  title: '"Excerpt from the Declaration of Independence" (1776)'
  annotation: 'The last in the list of grievances directed at King George cited in the Declaration of
    Independence indirectly references enslaved Americans and Lord Dunmore’s Proclamation: “He has excited
    domestic Insurrections amongst us”. The fact that enslaved people seeking freedom was termed an "insurrection"
    by the signers of the Declaration who were engaged in their own insurrection against the British hints
    at the contradictions around race and liberty that shaped the American Revolution. Students'' first
    inclination might be to dismiss the contradiction as hypocrisy but they should be encouraged to think
    through how some people in the past could accept this definition while others rejected it is key to
    understanding the past.'
  text: He has excited domestic insurrections amongst us, and has endeavoured to bring on the inhabitants
    of our frontiers, the merciless Indian Savages, whose known rule of warfare, is an undistinguished
    destruction of all ages, sexes and conditions.
  citation: Declaration of Independence, 1776, Library of Congress, https://www.loc.gov/item/2003576546
  image:
    url: /files/Declaraton.jpg
    alt: '"Excerpt from the Declaration of Independence" (1776)'
    width: 884
    height: 95
- subpage: 3
  title: 1st Rhode Island Regiment. Soldiers in Uniform. c. 1781.
  annotation: The print of Black soldiers from the 1st Rhode Island Regiment is a great visual source
    to establish for students the participation of Black soldiers in the American Revolution. Many of
    the soldiers in this unit were enslaved and fought for the promise of future freedom. Although free
    Black Americans had served in militias since the beginning of the war, George Washington had been
    initially reluctant to allow armed enslaved people to serve as soldiers and the fact that he did end
    up allowing it can be seen as evidence of the difficult circumstances the Continental Army found itself
    in. The 1st Rhode Island Regiment not served with distinction at the Battle of Rhode Island and the
    Siege or Yorktown as noted above, they also endured the harsh winter of 1777–1778 at Valley Forge.
  citation: Jean Baptiste Antoine de Verger, "Soldiers in Uniform," Williamsburg, Virginia [1781 to 1784]
    Library of Congress, https://www.loc.gov/item/2021669876/
  image:
    url: /files/RISoldiers.jpg
    alt: 1st Rhode Island Regiment. Soldiers in Uniform. c. 1781.
    width: 432
    height: 240
- subpage: 4
  title: '"Primus Hall, alias Trask. Petition to Congress" (January 4, 1838)'
  annotation: 'Primus Hall, also known as Trask Hall, was a free Black man from Massachusetts who volunteered
    to fight on the Patriot side during the American Revolution in January 1776. Like many such soldiers
    and their widows, later in life, he petitioned Congress for the pension he was due for his service.
    This document is the summary of Hall''s petition for his Revolutionary War pension which was filed
    in 1838 when Hall was 82 years old. It documents his extensive military service during the war: Hall
    served through the entire war on campaigns in New York, New Jersey, Rhode Island, and Virginia.'
  text: |-
    **PRIMUS HALL,**ALIAS **TRASK.**

    [To accompany bill **H.**R. No. 318.]

    JANUARY 4, 1838.

    MR. EWING, from the Committee on Revolutionary Pensions, made the following

    REPORT:

    ## 'The Committee on Revolutionary Pensions, to which the petition of Primus Hall, alias Trask, was referred, report :

    That the same committee, at the second session of the 24th Congress, investigated this case, and made a favorable report thereon; that the petition and evidence have been again examined with care, and entirely concurring in the sufficiency thereof, a bill is herewith reported; that the state of facts to which reference is made, and upon which this bill is predicated, are as follows:

    The petitioner is a man of color, and asks that a pension be granted to him for revolutionary services. He states, in his application to the **War**Department, that, in the month of February, 1776, he enlisted at Cambridge, in the State of Massachusetts, as a private soldier in the company commanded by Captain Joseph Butler, of the fifth Massachusetts regiment, to serve for the term of one year; that the whole of this term he was engaged at his post. He was at Winter hill, near Boston, while that city was besieged by General Washington, until its evacuation by the British. From thence he marched with the army to New York, where be remained until the enemy took possession of the city. He was in all the skirmishes from that period until the battle of White Plains, where he bore a part; thence his regiment, crossing the Hudson, marched into New Jersey, and was attached to the command of General Lee, when that officer was surprised and made prisoner, near Basking Ridge. The petitioner was after-wards in the battles of Trenton and Princeton, and having served out the entire period of bis enlistment, was honorably discharged at Morristown. **He**further states, that, in 1777, he again enlisted for the term of three months, in a company of militia commanded by Captain Samuel Flint, of Danvers, Massachusetts, in the regiment of Colonel Johnson, and marched to Saratoga, where his regiment joined the army under General Gates; that he was in the second engagement with the British, under Burgoyne, when his captain (Flint) and his lieutenant (Herrick) were killed. The

    Thomas Allen, print

    2 \_[ Rep. No. 275. ]

    petitioner claims to have faithfully served his whole tour of duty, and was discharged at East Chester.

    He claims further, that he served three months, in 1778, in the company commanded by Captain Woodbury, during which time he was in Rhode Island, assisting in the erection of fortifications, and performing the duty of a guard. That, in 1781-82, he served twenty-two months as steward to Colonel Timothy Pickering. And was finally discharged at Newburg, New York, in 1782, in the month of December.

    While in Virginia, attached to the army, in 1782, at Dumfries, his pocket-book, the petitioner states, was stolen from him, which contained his several discharges for his three first tours of duty; and his last discharge is also lost.

    The petitioner further states, that he did not apply for a pension under the law of 1818, in consequence of the amount of his property. He is now nearly eighty-one year$ of age, and needs the aid of his country. The evidence to sustain the petitioner's claim is-

    1st. The affidavit of Thomas Thorpe, who is eighty years of age. This witness enlisted at the same time with the petitioner, in Captain Butler's. company, and served out the whole period, as the petitioner in his application has stated, which exceeded twelve months; and his testimony corroborates the petitioner's in all the details of that service: the witness is **a**pensioner himself, and has been, since 1818, in part, for the same service.

    2d. The affidavit of Elijah Flint, the son of Captain Samuel Flint, who was killed at Saratoga. He states that he knew the petitioner was a soldier in his father's company, and served as he has stated. Also, the affidavit of John Brown, who belonged to the same company, and served with him for the whole term for which he was enlisted.

    The committee are satisfied that the petitioner has fully sustained, by dear and unimpeached testimony, the material statements in his memorial, and that he is justly entitled to a pension for a faithful service of eighteen months as a revolutionary soldier, not merely in camp duty, or the ordinary performance of military obligations, but in the field of battle, where his bravery and good conduct a1·e proved to have been such as would have done honor to any man.

    The Commissioner of Pensions has refused, from time to time, to allow **a**pension to this free colored man on different grounds; for a detail of which the committee refer to the papers marked 1, 2, 3, and 4, which they make a part of their report. The reasons given by the Commissioner, is sufficient in themselves at any time, have all been obviated, as the committee believe, by the testimony which has been produced.
  citation: Primus Hall, alias Trask. (To accompany Bill H.R. No. 318.) January 4, 1838. Library of Congress.
     <https://www.loc.gov/item/2022689407/>
- subpage: 5
  title: '"Primus Hall Death Notice" The Liberator (April 8, 1842)'
  annotation: After the war, Hall became a prominent figure in the free Black community in Boston and
    had connections to the abolitionist movement as evidenced by his obituary appearing in the nation's
    most prominent abolitionist newspaper, *The Liberator*. Hall’s military service and his life’s work
    of advocating for freedom for Black Americans shows how for some the cause of the Revolution connected
    to a wider notion of liberty.
  text: In Boston, on the 22d ult., Primus Hall, a respectable colored citizen, and a revolutionary pensioner
    of the U. S., aged 84. Mr Hall was well known, particularly to the younger portion of our citizens,
    to whom he was in the habit of recounting scenes of the revolutionary war, especially the capture
    of General Burgoyne, and the surrender of Lord Cornwallis, at both of which he was present. He was
    attached to the Quartermaster General’s Department, and for about two years was in the military family
    of General Washington, of whom he spoke with that fervor of attachment which was common to all who
    were personally acquainted with that great man. He has departed full of years, to meet, we trust,
    the reward of a good and faithful servant.
  citation: Primus Hall Death Notice, *The liberator* (Boston, Mass.), April 8, 1842 | Library of Congress
    https://www.loc.gov/item/sn84031524/1842-04-08/ed-1/
