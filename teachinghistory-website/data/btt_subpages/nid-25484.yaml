- subpage: 1
  title: Leo Szilard's Petition to the President (1945)
  annotation: |-
    Leo Szilard was one of the first physicists to identify the military application of atomic power. In fact, Szilard wrote most of the famous 1939 letter from Albert Einstein to then-President Franklin Delano Roosevelt outlining the potential of such a bomb and the fears that Hitler’s Germany was currently working to develop one that helped set the American Manhattan Project in motion. As the atomic tests reached their successful conclusion, however, Szilard raised serious concerns about the practical use of such weapons against civilian targets.

    In July 1945, he circulated a petition among the scientists who had worked on the bomb’s construction in an effort to discourage the President from employing it. Sixty-eight scientists signed the petition, which did not reject the use of the weapon wholesale but referred to the potential of a postwar atomic arms race which might have catastrophic consequences for the U.S. “The atomic bombs at our disposal,” the petition noted, “represent only the first step in this direction”; there would be “almost no limit to the destructive power which will become available” as scientists refined the technology. Thus their use to end World War II might serve as a disastrous example in the future: “the nation which sets the precedent of using these newly liberated forces of nature for purposes of destruction may have to bear the responsibility of opening the door to an era of devastation on an unimaginable scale.”
  text: |-
    A Petition to the President of the United States

    Discoveries of which the people of the United States are not aware may affect the welfare of this nation in the near future. The liberation of atomic power which has been achieved places atomic bombs in the hands of the Army. It places in your hands, as Commander-in-Chief, the fateful decision whether or not to sanction the use of such bombs in the present phase of the war against Japan. We, the undersigned scientists, have been working in the field of atomic power. Until recently, we have had to fear that the United States might be attacked by atomic bombs during this war and that her only defense might lie in a counterattack by the same means. Today, with the defeat of Germany, this danger is averted and we feel impelled to say what follows: The war has to be brought speedily to a successful conclusion and attacks by atomic bombs may very well be an effective method of warfare. We feel, however, that such attacks on Japan could not be justified, at least not unless the terms which will be imposed after the war on Japan were made public in detail and Japan were given an opportunity to surrender. If such public announcement gave assurance to the Japanese that they could look forward to a life devoted to peaceful pursuits in their homeland and if Japan still refused to surrender our nation might then, in certain circumstances, find itself forced to resort to the use of atomic bombs. Such a step, however, ought not to be made at any time without seriously considering the moral responsibilities which are involved. The development of atomic power will provide the nations with new means of destruction. The atomic bombs at our disposal represent only the first step in this direction, and there is almost no limit to the destructive power which will become available in the course of their future development. Thus a nation which sets the precedent of using these newly liberated forces of nature for purposes of destruction may have to bear the responsibility of opening the door to an era of devastation on an unimaginable scale. If after this war a situation is allowed to develop in the world which permits rival powers to be in uncontrolled possession of these new means of destruction, the cities of the United States as well as the cities of other nations will be in continuous danger of sudden annihilation. All the resources of the United States, moral and material, may have to be mobilized to prevent the advent of such a world situation. Its prevention is at present the solemn responsibility of the United States—singled out by virtue of her lead in the field of atomic power. The added material strength which this lead gives to the United States brings with it the obligation of restraint and if we were to violate this obligation our moral position would be weakened in the eyes of the world and in our own eyes. It would then be more difficult for us to live up to our responsibility of bringing the unloosened forces of destruction under control. In view of the foregoing, we, the undersigned, respectfully petition: first, that you exercise your power as Commander-in-Chief, to rule that the United States shall not resort to the use of atomic bombs in this war unless the terms which will be imposed upon Japan have been made public in detail and Japan knowing these terms has refused to surrender; second, that in such an event the question whether or not to use atomic bombs be decided by you in light of the considerations presented in this petition as well as all the other moral responsibilities which are involved.
  citation: '[The National Security Archive. [Leo Szilard''s Petition to the President of the United States,
    July 17, 1945](http://www.gwu.edu/~nsarchiv/NSAEBB/NSAEBB162/34.pdf). Accessed March 2, 2012.](http://www.gwu.edu/~nsarchiv/)'
