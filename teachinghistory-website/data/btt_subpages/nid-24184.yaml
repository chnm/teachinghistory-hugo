- subpage: 1
  title: “South Vietnamese Officer Executes a Viet Cong Prisoner” Photograph (1968)
  annotation: This has become for many the iconic vision of the confusion and failure of the U.S. adventure
    in Vietnam. It depicts the Chief of the South Vietnamese national police force, General Nguyen Ngoc
    Loan, summarily executing a suspected Viet Cong insurgent on the streets of Saigon during the Tet
    offensive. Eddie Adams won the Pulitzer Prize for this shot. Such seemingly gratuitous violence, splashed
    across the American media during the month of the Tet Offensive, convinced many American leaders,
    including President Johnson, that the war was a dangerous lost cause. Such beliefs contributed to
    the argument that Tet was the beginning of the end of U.S. involvement, despite the fact that the
    war lasted five more grueling and bloody years for American soldiers.
  citation: Adams, Eddie. [“South Vietnamese Officer Executes a Viet Cong Prisoner"](http://www.cah.utexas.edu/collections/photojournalists/adams_gallery.php).
    From the Dolph Briscoe Center for American History, University of Texas at Austin.
  image:
    url: /files/AP68020101443_sviet_crop.jpg
