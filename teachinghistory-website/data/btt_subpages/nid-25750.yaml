- subpage: 1
  title: “Going Mamma’s Errands” (1905)
  annotation: “Going Mamma’s Errands” is one of many colorful trade card advertisements that preceded
    the expansion of marketing during the Progressive era. The idealized version of girlhood represented
    in this advertisement for Heinz tomato products depicts girls’ errand running. Whether in the countryside
    or the Lower East Side, errand runners served important roles as consumers and conveyors of goods
    that connected families with communities and centers of consumption with sites of production.
  citation: Alan and Shirley Brocker Sliker Collection, MSS 314, Special Collections, Michigan State University
    Libraries. H.J. Heinz & Co. “[Going Mamma’s Errands](http://www.lib.msu.edu/exhibits/sliker/detail.jsp?id=4496).”
    Accessed September 26, 2012.
  image:
    url: /files/goingmommaserrands.jpg
    alt: “Going Mamma’s Errands” (1905)
    width: 373
    height: 593
- subpage: 2
  title: “Essentials of Arithmetic Primary Book” (1915)
  annotation: Among textbooks like the moralizing *McGuffey’s Eclectic Readers* that 19th-century students
    memorized and recited, Progressive-era arithmetic texts are useful sources for understanding the subtleties
    of gendering by educational institutions that experienced expansion and underwent reform. Aiming to
    promote a “work ethic” that buttressed traditional gender roles, word problems about chores described
    boys like Fred who planted 29 potatoes and Anna who ironed 15 towels. While boys engaged in outdoor
    labor in math word problems, ironing, shopping, washing, dusting, and sweeping provided the narrative
    contexts for tabulating girls’ homemaking chores.
  citation: 'Wentworth, George and David Eugene Smith. *[Essentials of Arithmetic Primary Book](http://books.google.com/books/about/Essentials_of_arithmetic.html?id=MQcAAAAAYAAJ)*.
    Boston: Ginn and Company, 1915.'
  image:
    url: /files/abook3.jpg
    alt: “Essentials of Arithmetic Primary Book” (1915)
    width: 353
    height: 916
- subpage: 3
  title: Lewis Hine Photographs (1912)
  annotation: |-
    Far less familiar among Lewis Hine’s photographs taken for the National Child Labor Committee is a contrasting pair of images that sheds light on changing notions of girlhood. While industrial homeworkers produce Campbell Kids dolls in a documentary image typical of child laborers, the middle-class girls in this prescriptive photo are “playing” house instead.

    The working-class model of childhood pathologized by reformers stands in contrast to the middle-class notion of girlhood Progressives promoted.
  citation: |-
    **Image 1:** Library of Congress, Congress Prints and Photographs Division, Reproduction No. LC-DIG-nclc-04209. Lewis Hine. “[Children Playing with Campbell Kid Dolls](http://hdl.loc.gov/loc.pnp/nclc.04209).” Accessed September 26, 2012.

    **Image 2:** Library of Congress, Congress Prints and Photographs Division, Reproduction No. LC-DIG-nclc-04209. Lewis Hine. “[Making Dolls Legs for Campbell Kids](http://hdl.loc.gov/loc.pnp/nclc.04143).” Accessed September 26, 2012.
  image:
    url: /files/untitled-1.jpg
    alt: Lewis Hine Photographs (1912)
    width: 460
    height: 592
- subpage: 4
  title: “Mui Tsai” (1905)
  annotation: |-
    Urban reformers labeled working-class girls who took care of younger siblings “Little Mothers.” While the title essentialized girls and sentimentalized their labor, girls of all races and ethnicities groused about their burdens and griped about their brothers’ freedom from childcare obligations. In Cincinnati, OH, African American girls became the focus of reformers who sought to instruct these future mothers in better baby care, according to an article published in *The Crisis*, the official publication of the NAACP.

    Although girls in Hispanic communities went largely unnoticed by reformers, Chinese domestic servants (mui tsai) who cared for kids, cleaned houses, and ran errands came to the attention of Presbyterian missionaries alarmed by the sexual slavery of Chinese girls.
  citation: Online Archive of California, Bancroft Library, University of California, Berkeley, Roy D.
    Graves Pictorial Collection, 1905.17000 v. 29:34. “[Chinese Children](http://www.oac.cdlib.org/ark:/13030/tf9199p54r/?layout=metadata&brand=oac4).”
    Accessed September 26, 2012.
  image:
    url: /files/muitsai.jpg
    alt: “Mui Tsai” (1905)
    width: 460
    height: 593
- subpage: 5
  title: “Protest Against Child Labor in a Labor Parade” (1909)
  annotation: |-
    This photograph of two girls wearing banners with the slogan “Abolish Child Slavery!!” in English and in Yiddish at a labor parade in New York City, probably on May 1, 1909, documents the high rate of labor activism by girls during the Progressive era.

    Not only did girls predominate in the garment industry and toiled in numerous other sectors of the industrial economy, they also worked as labor organizers. Rousing speeches by adolescent girls galvanized workers. Others like Rose Cohen wrote about their experiences as young workers.
  citation: Library of Congress Prints and Photographs Division, Reproduction No. LC-DIG-ppmsca-06591.
    “[Protest Against Child Labor in a Labor Parade](http://hdl.loc.gov/loc.pnp/ppmsca.06591).” Accessed
    September 26, 2012.
  image:
    url: /files/childlaborprotestsmaller.jpg
    alt: “Protest Against Child Labor in a Labor Parade” (1909)
    width: 460
    height: 345
bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Cohen, Rose. *Out of the Shadow: A Russian Jewish Girlhood on the Lower East Side*. New York: George H. Doran, 1918. *An autobiographical account of an Eastern European immigrant girl’s struggle to reconcile the cultures of the old world and the new.*

    Library of Congress. *[National Child Labor Committee Collection](http://www.loc.gov/pictures/collection/nclc/bibliography.html)*. *This collection includes more than 5,100 photographic prints and 355 glass negatives along with the National Child Labor Committee (NCLC) records.*

    Marquette University. *[Children in Urban America Project](http://www.marquette.edu/cuap/intro.shtml)*. *A digital archive on the history of children in Milwaukee that includes newspapers, government records, oral histories, memoirs, and many other documents useful to teachers, students, and historians.*

    Marten, James. *Childhood and Child Welfare in the Progressive Era: A Brief History with Documents*. (Bedford Series in History and Culture). New York: Bedford/St. Martin's, 2004. *Provides an introduction to the issues of Progressive-era reformers as well as a collection of primary sources from the period including documents by children.*

    University of Illinois at Urbana-Champaign. *[American History Online](http://www.americanhistoryonline.org/home)*. *This online project of the Andrew W. Mellon Foundation and the University of Illinois provides access to historical digital library collections. There are 176 primary sources on “Girls child labor,” 166 of which are photographs by Lewis Hine.*

    Yezierska, Anzia. *Bread Givers: A Novel*. 1925. *An autobiographical coming-of-age story about the youngest daughter of an Orthodox rabbi who contests her father’s rigid conceptions of Jewish girlhood as she pursues her independence.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Alexander, Ruth. *The Girl Problem: Female Sexual Delinquency in New York, 1900-1930*. New York: Cornell University Press, 1998. *A study of immigrant and African American female adolescent working-class delinquents incarcerated in two New York state reformatories.*

    Bartoletti, Susan Campbell. *Kids on Strike!*. Boston: Houghton Mifflin, 1999. *Written for middle school students, this well-documented history traces the role of laboring children and youth (especially girls) in 19th- and early 20th-century strikes.*

    Enstad, Nan. *Ladies of Labor, Girls of Adventure*. New York: Columbia University Press, 1999. *An interdisciplinary study that creatively demonstrates the role of consumer culture in the everyday lives of Progressive-era working girls.*

    Odem, Mary. *Delinquent Daughters: Protecting and Policing Adolescent Female *Sexuality in the United States, 1885-1920*. Columbia: University of North Carolina Press, 1995.*  *An outstanding study of female reformers’ views on female sexuality and the working-class girls who resisted their coercive reforms.*

    Peiss, Kathy. *Cheap Amusements: Working Women and Leisure in Turn-of-the-Century New York*. Philadelphia: Temple University Press, 1986. *A landmark study of the labor and commercial leisure activities of working-class girls and their resistance to the expectations of parents and reformers.*

    Rouse, Jorae Wendy. *The Children of Chinatown: Growing Up Chinese American in San Francisco, 1850-1920*. Chapel Hill: University of North Carolina Press, 2009. *A unique examination that sheds light on the historical agency of Chinese American children—including girls—in Chinatown during the Progressive period.*

    Zelizer, Viviana. *Pricing the Priceless Child: The Changing Social Value of Children*. Princeton University Press, 1994. *A ground-breaking study that traces the development of the modern child as economically "useless" and emotionally "priceless."*
