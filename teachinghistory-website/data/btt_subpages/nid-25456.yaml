- subpage: 1
  title: Massachusetts Law on Spinning (1655)
  annotation: The work women did was vital to the success of the colonies. In this 1655 law, the legislature
    of Massachusetts sets annual targets for the amount of spinning women—aided by young girls and boys—must
    do. Exemptions were permitted if a family could demonstrate they could not spare the hands, but any
    household that simply failed to make its quota would be fined.
  text: |-
    *This Court taking into serious Consideration the present freights and necessities of the Country, in respect of Cloathing, which is not like to be so plentifully supplied from foreign parts as in times past, and now knowing any better way or means conduceable to our subsistence, then the improving of as many hands as may be in Spinning Wool, Cotton, Flax, &c.*

    Doth therefore Order, and be in Ordered by the Authority of this Court; That all hands not necessarily imployed on other occasions, as Women, Girls and Boyes, shall and hereby are enjoyned to Spin according to their skill and ability; and that the Select men in every Town do consider the condition and capacity of every family, and accordingly do assess them at one or more Spinners;

    *And because Several Families are necessarily imployed the greatest part of their time in other business, yet if opportunities were attended, some time might be spared, at least be some of them for this work;*

    The Said Select Men shall therefore Assess such Families at half and quarter Spinners, according to their capacities.

    And every one thus aforesaid, for a whole Spinner, shall for time to come, Spin every Year for thirty Weeks, three pound a Week of Linnen, Cotton or Woollen, and so proportionably for half and quarter Spinners, under the penalty of twelve pence a pound short.

    And the Select Men shall take special care for the Execution of the Order, which may easily be effected by dividing their several towns into ten, six, five, &c. parts, and to appoint one of the ten, six, five, &c. to take an account of their Divisions, and to certifie the Select Men, if any be defective in what they are Assessed, who shall improve the penalties imposed on such as are negligent, for the encouragement of those that are diligent in this work, [1655]
  citation: 'From [*The Colonial Laws of Massachusetts, Reprinted from the Edition of 1672, with the Supplements
    through 1686: Containing Also, a Bibliographical Preface and Introduction, Treating of All the Printed
    Laws from 1649 to 1686: Together with the Body of Liberties of 1641, and the Records of the Court
    of Assistants, 1641-1644*](http://openlibrary.org/books/OL7200933M/The_colonial_laws_of_Massachusetts).
    William H. Whitmore, ed. Littleton, CO: Rothman, 1995.'
  image:
    url: /files/laborsource1.jpg
    alt: Massachusetts Law on Spinning (1655)
    width: 432
    height: 358
- subpage: 2
  title: Letter from Abigail Adams to John Adams (1776)
  annotation: In the period between the outbreak of war with Britain and the signing of the Declaration
    of Independence, women's work became even harder. In this letter, Abigail Adams writes to her husband
    John—away at the Continental Congress in Philadelphia—to look for supplies that she can no longer
    buy in Boston. She also describes another pressure on her workday—boarders, lodging at the Adams'
    home after being turned out of their own by the British.
  text: "*Excerpt from **Abigail Adams's letter of July 16, 1775**:*  \nEvery article here in the West\
    \ india way is very scarce and dear. In six [weeks] we shall not be able to purchase any article of\
    \ the kind. I wish you would let Bass get me one pound of peper, and 2 yd. of black caliminco for\
    \ Shooes. I cannot wear leather if I go bare foot the reason I need not mention. Bass may make a fine\
    \ profit if he layes in a stock for himself. You can hardly immagine how much we want many common\
    \ small articles which are not manufactured amongst ourselves, but we will have them in time. Not\
    \ one pin is to be purchased for love nor money. I wish you could convey me a thousand by any Friend\
    \ travelling this way. Tis very provoking to have such a plenty so near us, but tantulus like not\
    \ able to touch. I should have been glad to have laid in a small stock of the West India articles,\
    \ but I cannot get one copper. No person thinks of paying any thing, and I do not chuse to run in\
    \ debt. I endeavour to live in the most frugal manner posible, but I am many times distressed. —Trot\
    \ I have accommodated by removeing the office into my own chamber, and after being very angry and\
    \ sometimes persuaideding I obtaind the mighty concession of the Bed room, but I am now so crouded\
    \ as not to have a Lodging for a Friend that calls to see me. I must beg you would give them warning\
    \ to seek a place before Winter. Had that house been empty I could have had an 100 a year for it.\
    \ Many [persons] had applied before Mr. Trot, but I wanted some part of it my self, and the other\
    \ part it seems I have no command of. —We have since I wrote you had many fine showers, and altho\
    \ the crops of grass have been cut short, we have a fine prospect of Indian corn."
  citation: 'Massachusetts Historical Society. [*Adams Family Papers: An Electronic Archive*](http://www.masshist.org/digitaladams/aea/cfm/doc.cfm?id=L17750716aa).
    2003. Accessed May 1, 2012.'
- subpage: 3
  title: Advertisement for Slave Sale, Charleston, SC (1760)
  annotation: By the 18th century slavery was entrenched in the South, and shipments of enslaved men and
    women arrived regularly from Africa. This advertisement of a slave sale notes that slaves are from
    the "Windward & Rice Coast." Rice was the primary cash crop grown in South Carolina; slaves who were
    familiar with growing rice were especially valuable.
  citation: 'Virginia Foundation for the Humanities and University of Virginia. [The Atlantic Slave *Trade
    and Slave Life in the Americas: A Visual Record*](http://www.slaveryimages.org/). 2011. Accessed May
    1, 2012.'
  image:
    url: /files/laborsource3.jpg
    alt: Advertisement for Slave Sale, Charleston, SC (1760)
    width: 431
    height: 484
- subpage: 4
  title: John White, The Indian Village of Secoton (1585-86)
  annotation: John White was one of the first Englishmen to visit North America, and his artwork captured
    his impressions of life in what would one day be North and South Carolina. In this [illustration](/files/john_white_artwork.gif),
    White shows corn cultivation—a female responsibility in many Native communities—and shows men and
    women engaged in different tasks.
  citation: Virginia Center for Digital History, University of Virginia. [*Virtual Jamestown*](http://www.virtualjamestown.org/images/white_debry_html/white35.html).
    2007. Accessed May 1, 2012. Licensed by the Trustees of the British Museum.
  image:
    url: /files/laborsource4.jpg
    alt: John White, The Indian Village of Secoton (1585-86)
    width: 297
    height: 495
- subpage: 5
  title: John Barbot, A Description of the Coasts of North and South-Guinea (1732)
  annotation: This 1732 [illustration](/files/john_barbot_illustration.jpg) captures the beginning of
    the 'middle passage'—the long journey from Africa to the Americas that millions of Africans endured.
    In the foreground we see local canoes; in the background, European slaving ships and slave forts,
    at which the newly enslaved were held before being shipped abroad.
  citation: 'Virginia Foundation for the Humanities and University of Virginia. [*The Atlantic Slave Trade
    and Slave Life in the Americas: A Visual Record*](http://hitchcock.itc.virginia.edu/Slavery/details.php?categorynum=5&categoryName=Slave%20Ships%20and%20the%20Atlantic%20Crossing%20(Middle%20Passage)&theRecord=57&recordCount=78).
    2011. Accessed May 1, 2012.'
  image:
    url: /files/laborsource5.jpg
    alt: John Barbot, A Description of the Coasts of North and South-Guinea (1732)
    width: 403
    height: 295
bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Virginia Center for Digital History, University of Virginia. [*Virtual Jamestown*](http://www.virtualjamestown.org/page2.html). *Virtual Jamestown offers a treasure trove of documents related to the early settlement of Virginia. Browse court records, labor contracts, and firsthand accounts of settlement, as well as images that offer evidence of life for Native communities before and after contact with Europeans. You'll also find interviews with archaeologists and historians who are working to expand our understanding of Jamestown and surrounding regions.*

    Massachusetts Historical Society. [*Adams Family Papers: An Electronic Archive*](http://www.masshist.org/digitaladams/). *The letters exchanged by John and Abigail Adams over the course of their courtship and marriage are a rich source of information for life in colonial America. There is a great deal of information about matters of state in this correspondence—John was deeply involved in plans for independence, and the execution of the Revolutionary War—but equally, they are a boundless source of information about women's lives, responsibilities, and patterns of work. Abigail relays familial information to John, giving us a glimpse of what it was to be a child in colonial New England, and there is much information about disease, financial struggle, and spiritual belief.*

    Virginia Foundation for the Humanities and University of Virginia. [*The Atlantic Slave Trade and Slave Life in the Americas: A Visual Record*](http://www.slaveryimages.org/). *This website offers an incredible range of images relating to slavery in the Atlantic world. You can find images of life in pre-colonial Africa, illustrations related to the capture of slaves and life at slave ports, information about the middle passage, and countless images that depict the work slaves did once they reached the Americas. An invaluable resource.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Brown, Kathleen M. *Foul Bodies: Cleanliness in Early America*. New Haven: Yale UP, 2011. *Brown's book examines the history of early America through colonial bodies, and the work that it took to keep them clean and free of disease. This work was overwhelmingly women's work, and Brown argues that it had deep social, political, and spiritual implications for society as a whole.*

    Kupperman, Karen Ordahl. *The Jamestown Project*. Cambridge: Harvard UP, 2007. *Many of the men who founded Jamestown were, Kupperman argues, global citizens—individuals who carried to Virginia their experiences as traders, sailors, and explorers in other parts of the world. For the first 10 years of Jamestown's existence, the colonists experienced crisis after crisis. This was, Kupperman asserts, to be expected from individuals figuring out the best way in which to create and sustain a colony given the multitude of different experiences they possessed.*

    Landsman, Ned C. *Crossroads of Empire: The Middle Colonies in British North America*. Baltimore: Johns Hopkins UP, 2010. *While settled by different people for different political, social, and religious ends, the regions that became New York, New Jersey, and Pennsylvania gradually developed a common economic and cultural outlook, argues Ned Landsman. That outlook was created and refined by trade relationships, philosophical debates, and relations (both violent and peaceful) with local Native communities.*

    Main, Gloria L. *Peoples of a Spacious Land: Families and Cultures in Colonial New England*. Cambridge: Harvard UP, 2001. *In this book, Main explores the meaning of family for Native communities and English colonists in New England to determine how families functioned, changed, and interacted over time. Main also compares these family structures to those in England, providing a point of comparison for what changed for colonists, and what didn't.*

    Richter, Daniel K. *Before the Revolution: America's Ancient Pasts*. Cambridge: Belknap Press, 2011. *America's history did not begin with the arrival of European colonists. In this book, Daniel Richter explores centuries of pre-contact history, before charting the ways in which Europeans and Native people met, understood each other, responded to challenges, and weathered change.*
