primary_sources:
- subpage: 1
  title: Long's Autobiography (1933)
  annotation: In 1933 Long wrote an autobiography, *Every Man A King*, which is not surprisingly very
    self-serving, but also reveals a great deal about the man. He several times describes his family as
    poor, which they clearly were not—other family members, in fact, strongly resented this claim. The
    biography is still in print. The Social Security Administration has several [excerpts](http://www.ssa.gov/history/huey.html)
    available.
  text: '*Excerpt from* **Every Man a King***:* I HAD come to the United States Senate with only one project
    in mind, which was that by every means of action and persuasion I might do something to spread the
    wealth of the land among all of the people. I foresaw the depression in 1929. . . I had predicted
    all of the consequences many years before they occurred. The wealth of the land was being tied up
    in the hands of a very few men. The people were not buying because they had nothing with which to
    buy. The big business interests were not selling, because there was nobody they could sell to. One
    per cent of the people could not eat any more than any other one per cent; they could not wear much
    more than any other one per cent; they could not live in any more houses than any other one per cent.
    So, in 1929, when the fortune-holders of America grew powerful enough that one per cent of the people
    owned nearly everything, ninety-nine per cent of the people owned practically nothing, not even enough
    to pay their debts, a collapse was at hand. God Almighty had warned against this condition. Thomas
    Jefferson, Andrew Jackson, Daniel Webster, Theodore Roosevelt, William Jennings Bryan and every religious
    teacher known to this earth had declaimed against it. So it was no new matter, as it was termed, when
    I propounded the line of thought with the first crash of 1929, that the eventful day had arrived when
    accumulation at the top by the few had produced a stagnation by which the vast multitude of the people
    were impoverished at the bottom. There is no rule so sure as that one that the same mill that grinds
    out fortunes above a certain size at the top, grinds out paupers at the bottom. The same machine makes
    them both; and how are they made? There is so much in the world, just so much land, so many houses,
    so much to eat and so much to wear. There is enough--yea, there is more--than the entire human race
    can consume, if all are reasonable. All the people in America cannot eat up the food that is produced
    in America; all the people in America cannot wear out the clothes that can be made in America; nor
    can all of the people in America occupy the houses that stand in this country, if all are allowed
    to share in homes afforded by the nation. But when one man must have more houses to live in than ninety-nine
    other people; when one man decides he must own more foodstuff than any other ninety-nine people own;
    when one man decides he must have more goods to w ear for himself and family than any other ninety-nine
    people, then the condition results that instead of one hundred people sharing the things that are
    on earth for one hundred people, that one man, through his gluttonous greed, takes over ninety-nine
    parts for himself and leaves one part for the ninety-nine. Now what can this one man do with what
    is intended for ninety-nine? He cannot eat the food that is intended for ninety-nine people; he cannot
    wear the clothes that are intended for ninety-nine people; he cannot live in ninety-nine houses at
    the same time; but like the dog in the manger, he can put himself on the load of hay and he can say:
    "This food and these clothes and these houses are mine, and while I cannot use them, my greed can
    only be satisfied by keeping anybody else from having them." Wherefore and whence developed the strife
    in the land of too much, beginning in the year 1929.'
  citation: 'Long, Huey. *Every Man a King*. New Orleans: National Book Co., 1933.'
- subpage: 2
  title: '"Every Man a King" Speech (1934)'
  annotation: In [this speech](http://www.senate.gov/artandhistory/history/common/generic/Speeches_Long_EveryManKing.htm),
    Long sketched out in broad form his redistribution plan. When the Founding Fathers wrote "all Men
    are created equal," Long said "Did they mean, my friends, to say that all men were created equal and
    that that meant that any one man was born to inherit $10,000,000,000 and that another child was to
    be born to inherit nothing?"
  text: '*Excerpt from* **"Every Man a King" speech***:* Every man a king, so there would be no such thing
    as a man or woman who did not have the necessities of life, who would not be dependent upon the whims
    and caprices and ipse dixit of the financial martyrs for a living. What do we propose by this society?
    We propose to limit the wealth of big men in the country. There is an average of $15,000 in wealth
    to every family in America. That is right here today. We do not propose to divide it up equally. We
    do not propose a division of wealth, but we propose to limit poverty that we will allow to be inflicted
    upon any man''s family. We will not say we are going to try to guarantee any equality, or $15,000
    to families. No; but we do say that one third of the average is low enough for any one family to hold,
    that there should be a guaranty of a family wealth of around $5,000; enough for a home, and automobile,
    a radio, and the ordinary conveniences, and the opportunity to educate their children; a fair share
    of the income of this land thereafter to that family so there will be no such thing as merely the
    select to have those things, and so there will be no such thing as a family living in poverty and
    distress. We have to limit fortunes. Our present plan is that we will allow no one man to own more
    than $50 million. We think that with that limit we will be able to carry out the balance of the program.
    It may be necessary that we limit it to less than $50 million. It may be necessary, in working out
    of the plans, that no man''s fortune would be more than $10 million or $15 million. But be that as
    it may, it will still be more than any one man, or any one man and his children and their children,
    will be able to spend in their lifetimes; and it is not necessary or reasonable to have wealth piled
    up beyond that point where we cannot prevent poverty among the masses.'
  citation: 'Byrd, Robert C., ed. [*The Senate, 1789-1989: Classic Speeches, 1830-1993*](http://openlibrary.org/b/OL10112878M/Senate_1789-1989_V._3).
    Washington, DC: Government Printing Office, 1994.'
- subpage: 3
  title: '"Barbecue" Speech (1934)'
  annotation: Long gave this speech to a group of Senate staffers. It can be read online and viewed as
    video at http://www.americanrhetoric.com/speeches/hueyplongshare.htm. Long used the barbecue metaphor
    in more than one speech. The video clip gives a good sense of his style.
  text: '*Excerpt from* **"Barbecue" speech***:* Now we got a barbecue. We have been praying to the Almighty
    to send us to a feast. We have knelt on our knees morning and nighttime. The Lord has answered the
    prayer. He has called the barbecue. "Come to my feast," He said to 125 million American people. But
    Morgan and Rockefeller and Mellon and Baruch have walked up and took 85 percent of the victuals off
    the table! Now, how are you going to feed the balance of the people? What''s Morgan and Baruch and
    Rockefeller and Mellon going to do with all that grub? They can''t eat it, they can''t wear the clothes,
    they can''t live in the houses. Giv''em a yacht! Giv''em a Palace! Send ''em to Reno and give them
    a new wife when they want it, if that''s what they want. [Laughter] But when they''ve got everything
    on God''s loving earth that they can eat and they can wear and they can live in, and all that their
    children can live in and wear and eat, and all of their children''s children can use, then we''ve
    got to call Mr. Morgan and Mr. Mellon and Mr. Rockefeller back and say, come back here, put that stuff
    back on this table here that you took away from here that you don''t need. Leave something else for
    the American people to consume. And that''s the program. [Applause]'
  citation: 'Long, Huey. "[Share Our Wealth](http://www.americanrhetoric.com/speeches/hueyplongshare.htm)."
    Speech, radio, National Broadcasting Company, New York, March 7 1935. From [*American Rhetoric: Top
    100 Speeches*](http://www.americanrhetoric.com/). Accessed May 1, 2012.'
- subpage: 4
  title: Long's Fictional Autobiography (1935)
  annotation: In typically brash style, Long quickly wrote *My First Days In the White House* as a prop
    for his campaign. Excerpts can be read at http://www.ssa.gov/history/hlong1.html.
  text: '*Excerpt from* **My First Days in the White House***:* It had happened. The people had endorsed
    my plan for the redistribution of wealth and I was President of the United States. I had just sworn
    upon the Bible from which my father read to us as children to uphold the Constitution and to defend
    my country against all enemies, foreign and domestic. Yet standing there on the flag-draped platform
    erected above the East portico of the Capitol, delivering my inaugural address, it all seemed unreal.
    I felt that I was dreaming. The great campaign which was destined to save America from Communism and
    Fascism was history. Other politicians had promised to re-make America; I had promised to sustain
    it. The campaign had been bitter. I was cartooned and caricatured unmercifully in some of the newspapers
    . . . As my eyes swept the throng before me, I paused in my inaugural address and looked into the
    face of the retiring president. He seemed worn and tired. He wore the same expression of resigned
    fatigue that I had observed in the face of President Hoover on Inauguration Day in 1933 when Mr. Roosevelt
    declared so confidently that: "The only thing we have to fear is fear itself." And with all humility,
    fully conscious of the solemnity of the promise I was making, I laid aside my prepared speech and
    closed my inaugural address extemporaneously with these words: "I promise life to the guaranties of
    our immortal document, the Declaration of Independence, which has decreed that all shall be born equal,
    and by this I mean that children shall not come into this life burdened with debt, but on the contrary,
    shall inherit the right to life, liberty and such education and training as qualifies them and equips
    them to take their proper rank in the pursuance of the occupation and vocation wherein they are worth
    most to themselves and to this country. And now I must be about my work." The former president arose
    and seized my hands. He shouted something in my ear but his words were drowned by the roar from the
    crowd.'
  citation: 'Huey, Long. [*My First Days in the White House*](http://openlibrary.org/b/OL6324598M/My_first_days_in_the_White_House).
    Harrisburg, PA: Telegraph, 1935.'
- subpage: 5
  title: Long Legacy Project
  annotation: Huey Long, and the Long family, had a remarkable impact on Louisiana and the U.S. generally.
    Huey's son Russell Long served in the U.S. Senate for almost 40 years. The [Long Legacy Project](http://www.hueylong.com/index.php)
    is a privately funded project to commemorate Huey Long's legacy.
  text: '*Excerpt from* **Huey Long: The Man, His Mission, and Legacy***:* I came from a fairly well-to-do
    family because of Huey Long''s Administration. I am a Black retired U.S. Postman. I think of the wonders
    he has contributed to making our jobs so easy and not as complex as described in the old days. What
    a great job well done in promoting Louisiana as he has. Our love and generous appreciation extends
    in the surpass. Thanks for a job truly well done. . . We miss you Gov. Long. YOU are not dead in our
    hearts, you are only just away. May God bless your spirit that hangs proudly in the skies of the old
    state we both call home—Louisiana. —DLC, retired U.S. Postman'
  citation: 'Long Legacy Project. [*Huey Long: The Man, His Mission, and Legacy*](http://www.hueylong.com/index.php).
    2009. Accessed May 1, 2012.'
