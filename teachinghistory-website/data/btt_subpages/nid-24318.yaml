- subpage: 5
  title: Photo of the Occupation of Alcatraz Island by the American Indian Movement (1969)
  annotation: This is an example of the 20th-century resistance of American Indians to oppression that
    occurred at the same time as the modern Civil Rights Movement.
  citation: Johnson, Troy. [*The American Indian Occupation of Alcatraz Island 1969–1971*](https://www.nebraskapress.unl.edu/university-of-nebraska-press/9780803217799/).
    1995. Accessed May 1, 2012. Jrgens, Iris. "[AIM Takeover of Alcatraz](http://irisjrgens.ifunnyblog.com/aimtakeoverofalcatraz/)."
    From *5 Black Cats*. 2010. Accessed May 1, 2012.
