    "[COINTELPRO FBI Domestic Intelligence Activities](http://whatreallyhappened.com/RANCHO/POLITICS/COINTELPRO/COINTELPRO-FBI.docs.html)." From *What Really Happened*. 2010. Accessed May 1, 2012.
