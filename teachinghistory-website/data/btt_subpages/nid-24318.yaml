bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Hartford, Bruce. [*Civil Rights Movements Veterans*](http://www.crmvet.org/); and Michaels, Sheila B. [*List of Oral Histories*](http://www.crmvet.org/nars/orallist.htm). *These websites present the stories of veterans of the modern Civil Rights Movement in their own words and represent a range of experiences and insights.*

    Holsaert, F.S., Noonan, M.P.N., Richardson, J., Robinson, B.G., Young, J.S. & Zellner, D.M., eds. *Hands on the Freedom Plow: Personal Accounts by Women in SNCC.* Chicago: University of Illinois Press, 2010.  *This book presents the personal stories of many women—African American, white, Latina, northern, southern, urban and rural—who were active with the formation and organizing of the Student Non-violent Coordinating Committee.*

    Martinez, E. *Five Hundred Years of Chicana Women’s History*. New Brunswick, NJ: Rutgers University Press, 2007.  *This thorough book documents—in photos, interviews, and profiles—the many Mexican American women throughout the centuries and across North America who have struggled for social justice.*

    University of Southern Mississippi. [*University of Southern Mississippi Center for Oral History and Cultural Heritage*](http://www.usm.edu/oralhistory/alphandx.html#Civil%20Rights%20Movement).  *Among the many oral histories on a range of subjects, the Center maintains an archive of over 150 oral histories of veterans of the modern Civil Rights Movement.*

    TWF Films. [*Aoki: A Documentary Film*](http://www.aokifilm.com/). 2009. *This film chronicles the life (and especially the last five years) of Richard Aoki, a third-generation Japanese American who was one of the founding members of the Black Panther Party.*
- subpage: 8
  title: Secondary Sources
  content: |-
    Egerton, J. *Speak Now Against the Day: The Generation Before the Civil Rights Movement in the South*. Chapel Hill, NC: University of North Carolina Press, 1994. *This informative novel tell the story of story of Southerners who challenged the theory of white supremacy before the Supreme Court outlawed school segregation and before Rosa Parks refused to surrender her seat on a Montgomery bus.*

    Menkart, Deborah, Alana Murray, and Jenice L. View, eds. [*Putting the Movement Back into Civil Rights Teaching: A Resource Guide for Classrooms and Communities.*](http://bbpbooks.teachingforchange.org/book/9781878554185) United States: McArdle Printing, 2004.  *This book contains K-12 lessons, primary sources, teacher reflections on teaching about the modern Civil Rights Movement, poetry, photos, and essays to help teachers construct more meaningful approaches to this period in history. The companion website published by the [*Poverty and Race Research Action Council and Teaching for Change*](http://www.civilrightsteaching.org/) includes supplemental materials and many primary sources as well.*

    Payne, Charles M. and Adam Green. *Time Longer than Rope: A Century of African American Activism, 1850-1950*. New York: New York UP, 2003.  *This book documents the range of efforts by African Americans to preserve the promises of the post-Civil War and Reconstruction and regain the rights lost to the legal segregation and violence of the first half of the 20th century.*

    Ransby, Barbara. *Ella Baker and the Black Freedom Movement: A Radical Democratic Vision*. Chapel Hill, NC: University of North Carolina Press, 2003.  *One of the many brilliant strategic thinkers and social justice organizers of the 20th century, Ella Baker was also central to many of the successes of the modern Civil Rights Movement, including as a field director of the NAACP, as the first executive director of the Southern Christian Leadership Conference, and as the “godmother” of the Student Nonviolent Coordinating Committee.*

    Salomon, Larry R. *Roots of Justice: Stories of Organizing in Communities of Color*. San Francisco: Chardon Press Series/Jossey Bass, 2003. *This book documents some of the social and racial justice struggles of American Indians, Asian Pacific Islanders, Latino/as, and African Americans in the United States, dating to before the 19th century.*

    Teaching for Change and Rethinking Schools. *[Zinn Education Project](http://zinnedproject.org/)*.  *Promotes the use of Howard Zinn’s *A People’s History of the United States* and other primary and secondary materials to introduce students to a more accurate, complex, and engaging understanding of United States history that is found in traditional history textbooks and curricula.*
