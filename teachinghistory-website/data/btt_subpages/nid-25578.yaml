- subpage: 1
  title: Mildred Chadsey, “Municipal Housekeeping” (1915)
  annotation: In this article, Mildred Chadsey outlined the principles of municipal housekeeping. In an
    increasingly modern, interdependent world, she wrote, American cities had begun to face the same sorts
    of “housekeeping” tasks that homemakers faced every day. In crowded, polluted, unsanitary industrial
    areas, how could citizens work together to making cities “clean, healthy, comfortable, and attractive”?
  text: "*Excerpt from **\"Municipal Housekeeping\"**:*  \nHousekeeping is the art of making the home\
    \ clean, healthy, comfortable and attractive. Municipal housekeeping is the science of making the\
    \ city clean, healthy, comfortable and attractive. Many tasks of housekeeping that were formerly performed\
    \ by the individual householder are now performed by city officials. So gradually has the city taken\
    \ over tasks that were once performed by the individual householders, and so many other tasks have\
    \ been put upon it as it has grown into the complex and intricate thing that it is, and living in\
    \ it has become such a co-related and interdependent process, that it is now confronted in a very\
    \ real sense by the same problem on a highly magnified scale that confronts the individual housekeeper\
    \ in making the home a clean, healthy, comfortable and attractive place in which to live.\n\nUnder\
    \ modern conditions the homemaker does right to buy the household necessities, the furniture, the\
    \ food, the clothes from the factory because they are made more cheaply and better there than she\
    \ can have them made at home. She would be a social and economic failure if she did not adjust herself\
    \ to the new industrial order of the factory system. She has not less human kindness and sympathy\
    \ because she allows her sick to be cared for in the hospital, nor has she less maternal love because\
    \ she sends her children out of the home to be educated. She merely recognizes that she is living\
    \ in an age of specialization, and because she wants the best care and the best training for those\
    \ she loves, she entrusts them to the care of specialists. It is not that she has failed to make home\
    \ attractive that the older children seek their pleasure outside the home. It is because of their\
    \ growing sociability, the result of the community life which leads them into broader fields of human\
    \ interest and human endeavor than those set by the confines of the home. Such a home implies not\
    \ independence, but interdependence. It establishes new bonds of human relationship, coordinated endeavor\
    \ and community interests. Therefore many of the tasks that the individual housekeeper performed for\
    \ her household have been projected into the community, both for the advantage of mutual service and\
    \ of collective bargaining. . . .\n\nThe first and most important function of any housekeeper is to\
    \ keep the home clean. The disposal of waste, such as garbage, rubbish, sewage, the cleaning of its\
    \ street, the prevention of smoke and other noxious substances in the air, are all important measures\
    \ in keeping the city clean. Yearly new methods of sewage disposal and sewage treatment are being\
    \ devised by one group of experts while the dangers which result from failure to properly dispose\
    \ of waste matter are being studied by another group. New problems in keeping the city clean are constantly\
    \ presenting themselves for solution. Not only does the city in its effort to keep itself clean, establish\
    \ departments that perform these duties, but it passes laws requiring individual property owners to\
    \ maintain their premises in a cleanly condition and it restrains individuals from uncleanly acts,\
    \ such as dumping refuse on streets or on other people's property, committing nuisances or expectorating\
    \ on streets, and it employs inspectors whose duties it is to enforce these laws. Some one has said\
    \ that the same God that wrote the decalogues wrote the sanitary code. Surely an efficient enforcement\
    \ of it is a God-like task, and one that is just about as difficult to perform as other God-like tasks\
    \ are when performed by mere man."
  citation: Chadsey, Mildred. "[Municipal Housekeeping](http://hearth.library.cornell.edu/cgi/t/text/pageviewer-idx?c=hearth;cc=hearth;rgn=full%20text;idno=4732504_7_002;didno=4732504_7_002;view=image;seq=3;node=4732504_7_002%3A5.1;page=root;size=s;frm=frameset;),"
    *The Journal of Home Economics*, 7 (Feb. 1915).
- subpage: 2
  title: Theodore Basselin, Testimony (1891)
  annotation: In his testimony before the New York State legislature in 1891, Theodore B. Basselin—a wealthy
    lumber magnate who had been appointed to New York’s Forest Commission—described the difficulties that
    government officials encountered in trying to implement new forest-protection laws. Locals long accustomed
    to cutting timber from public lands did not take kindly to the Forest Commission’s efforts to “educate
    those people” that “the State had assumed a different line of policy, the protecting of the forest,
    instead of cutting it off.”
  text: "*Excerpt from **Theodore Basselin's testimony**:*  \n[W]e also found that the people around about\
    \ the borders of this wilderness had been educated from time immemorial, that is, from the first settlement\
    \ of the country, that what belonged to the State was public property, and that they had a right to\
    \ go in there and cut as they wanted to; that their fathers and forefathers had been doing that, and\
    \ that they had a birthright there that no one could question; our endeavor and our efforts were all\
    \ placed toward trying to educate those people in a different line; the State had assumed a different\
    \ line of policy, the protecting of the forest, instead of cutting it off; now, in regard to the small\
    \ depredators along the borders of the wilderness, who had looked upon it as a birthright, it was\
    \ necessary for us to proceed carefully, as no one knew better than I did what danger an enemy or\
    \ a man who had a spite could cause to the State by fires…."
  citation: 'Basselin, Theodore. Testimony, February 17, 1891, in “[Testimony Taken by the Assembly Committee
    on Public Lands and Forestry Concerning the Administration of Laws in Relation to the Forest Preserve
    by the Forest Commission, Etc](http://books.google.com/books?id=HNBKAAAAMAAJ&vq=%22defeated%20in%20a%20very%20large%20case%22&dq=%22defeated%20in%20a%20very%20large%20case%22&pg=PA163#v=snippet&q=%22defeated%20in%20a%20very%20large%20case%22&f=false),”
    *Documents of the Assembly of the State of New York, Volume 114, Issues 74-82*, New York State Legislature
    (Albany, NY: James B. Lyon, 1891).'
- subpage: 3
  title: Captain Jim, Letter to Commissioner of Indian Affairs (1915)
  annotation: When Congress created the Grand Cañon Forest Reserve, its boundaries completely surrounded
    the Havasupai reservation and encompassed the tribe’s traditional hunting, gathering, and grazing
    territories. Suddenly, when Native Americans hunted deer on their traditional lands, they were committing
    the crime of “poaching.” As state efforts to enforce game protection laws increased, they prompted
    this letter from a tribe member to the Commissioner of Indian Affairs, demanding permission to hunt
    so that there would “be no trouble with the Game Wardens.”
  text: "*Excerpt from **Captain Jim's letter of September 15, 1915**:*  \nA long time ago the Gods gave\
    \ the deer to the Indian for himself. The women and children all like deer meat very much. The Indian\
    \ men like buckskins to trade for grub, saddles, horses, saddles, blankets, and money. A long time\
    \ ago . . . the Indians all go out on the plateau and hunt deer for two or three months and then all\
    \ come back to Supai [village] to stay. . . . Now the Indians are all afraid about the hunting and\
    \ never go far away. I want you to send me a hunting license and tell me good and straight that I\
    \ may hunt deer. . . . The white man should now help the Indians by giving him permission to hunt\
    \ deer as there be no trouble with the Game Wardens. . . . This is all."
  citation: 'Captain Jim. Letter to Commissioner of Indian Affairs, September 25, 1915, File 115, Havasupai
    Agency, Central Classified Files, 1907-39, Records of the Bureau of Indian Affairs, RG 75, National
    Archives, as quoted in Karl Jacoby, *Crimes Against Nature* (Berkeley, CA: University of California
    Press, 2001).'
- subpage: 4
  title: Thomas Means, "Discussion of Irrigation" (1909)
  annotation: Federal reclamation projects in the arid West promised to transform unwatered land into
    an agricultural Eden, but settlers often found the work, expense, and risks of life on the irrigated
    frontier much more demanding than they expected.
  text: "*Excerpt from **\"Discussion of Irrigation\"**:*  \nThe man in the gloomy back office in Chicago,\
    \ who reads of the sunshine and freedom of the West, where a man can wear overalls and a flannel shirt\
    \ and yet be respected, often overlooks the fact that he will have to wield the business end of a\
    \ pitchfork in the hot sun, instead of a pen beneath the cheerful buzz of an electric fan. He thinks\
    \ of the cool shade of a grape arbor and has an idea that, by sitting on the back porch, he can pull\
    \ a string which will lift a gate and irrigate the back lot. When he gets into the real practice of\
    \ irrigation, and his ditch breaks down and drowns half his crop and the other half dries up before\
    \ the ditch is fixed, and his whole year's work is gone; or when, in the middle of a hot afternoon,\
    \ the blinding sweat is pouring over his face as he pitches a few more tons of hay on the wagon, he\
    \ thinks of that Chicago office with the electric fan as one of the most attractive places, and it\
    \ is no wonder he becomes a bit discouraged."
  citation: 'Means, Thomas. “[Discussion of Irrigation](http://archive.org/stream/transactionsengi62amer#page/44/mode/2up),”
    *Transactions of the American Society of Civil Engineers*, 62 (1909): 44, as quoted in Donald Worster,
    *Rivers of Empire* (New York: Oxford University Press, 1985).'
- subpage: 5
  title: “Report on Kaibab Deer Problem” (1931)
  annotation: Conservation-inspired predator control programs in the Grand Canyon National Game Preserve
    caused deer populations to skyrocket in the early 1920s. Large herds overbrowsed their range, caused
    ecological damage, and ultimately undermined their own subsistence, causing mass starvation and a
    population collapse.
  text: "*Excerpt from **\"Report on Kaibab Deer Problem\"**:*  \nThe Kaibab Investigative Committee has\
    \ traveled approximately six hundred and fifty miles in the actual field examination of the Kaibab\
    \ area during a period of eight days. Travel was greatly facilitated because of the numerous motor\
    \ trails traversing the Kaibab Forest. The party, however, rode horses from Swamp Point in making\
    \ the Powell Plateau trip, which is within the Grand Canyon National Park. The committee has observed\
    \ practically every forest type and condition within the Kaibab area. . . .\n\nThe territory had long\
    \ been a famous hunting ground for Indians and the settlers came here for much of their wild meat\
    \ supply. Campaigns for the destruction of predatory animals were extended. Several hundred cougars,\
    \ thousands of coyotes, as well as many wildcats, and the few gray wolves of the region were destroyed.\
    \ The deer, relieved of the destructive effect of their wild and human enemies, swiftly began to show\
    \ a marked increase in number.\n\nBy 1920 the officers of the Forest Service in charge of the Kaibab\
    \ became concerned at the progressive deterioration of the range. In 1924 a committee of men not connected\
    \ with the Forest Service was appointed to study the range conditions of the territory and determine\
    \ whether there were more deer on the Kaibab than the food supply would sustain. This investigating\
    \ committee reported that not only were there too many deer in the territory to subsist on the available\
    \ food, but that the range had been so largely depleted that it was in imminent danger of being totally\
    \ destroyed over large areas. It, therefore, recommended the removal of at least one-half of the deer\
    \ at once. Although their recommendations were not immediately carried out by the State and Federal\
    \ authorities, some reductions have been made every year by these agencies. In addition there has\
    \ been much loss to the herd due to starvation on the winter range. . . .\n\nIt is the conclusion\
    \ of the committee, after carefully reviewing the general condition of the Kaibab range, and also\
    \ observing the degree of recovery within the fenced experimental plots that the Kaibab area is not\
    \ now producing more than 10% of the available and nutritious forage that this range once produced.\
    \ . . .\n\nThe forage of the entire Kaibab area is yet in a deplorable condition and with the exception\
    \ of the east side winter range, it is doubtful whether there has been any considerable range recovery\
    \ due to the reduction of the deer herd. It is believed, however, by those who have studied Kaibab\
    \ conditions over several years, that in places there is a slight suspension of range deterioration\
    \ because of the reduction of the deer and domestic stock."
  citation: Kaibab Investigative Committee. “Report on Kaibab Deer Problem.” 1931.
bibliographies:
- subpage: 7
  title: Primary Sources
  content: |-
    Roosevelt, Theodore. “[Utilizing Our Natural Resources: Address Delivered Before the National Editorial Association in Jamestown, Virginia, June 10, 1907](http://books.google.com/books?id=pp8-AAAAYAAJ&dq=roosevelt%20policy%20utilizing%20our%20natural%20resources%20national%20editorial%20association&pg=PA546#v=onepage&q&f=false).” In *The Roosevelt Policy: Speeches, Letters and State Papers, Relating to Corporate Wealth and Closely Allied Topics, of Theodore Roosevelt, President of the United States, Volume 2*, 546-560. New York: Current Literature Publishing Company, 1908.  *President Theodore Roosevelt’s speech before the National Editorial Association in 1907 declared that “the reckless waste and destruction of much of our natural wealth” was “the fundamental problem which underlies almost every other problem of our national life.” Without the foresight, careful planning, and scientific management embodied in his conservation policies, Roosevelt predicted that the nation would “undermine [the] material basis” for the nation’s institutions and economic growth.*

    Pinchot, Gifford. [*The Fight for Conservation*](http://books.google.com/books?id=LC0pAAAAYAAJ&dq=gifford%20pinchot%20conservation&pg=PP1#v=onepage&q=gifford%20pinchot%20conservation&f=false). New York: Doubleday, Page, and Company, 1910.  *This insider’s account of the conservation movement, written by the first Chief of the U.S. Forest Service, who was also one of President Theodore Roosevelt’s trusted advisers, offers perhaps the most-used definition of conservation: “Conservation means the greatest good to the greatest number for the longest time.”*

    Muir, John. [*The Yosemite*](http://books.google.com/books?id=vl4AAAAAYAAJ&dq=john%20muir%20yosemite&pg=PP1#v=onepage&q=john%20muir%20yosemite&f=false). New York: The Century Co., 1912.  *John Muir, another towering figure in the conservation movement, was a prolific and eloquent writer. His books and essays about wild nature—including this one on his ramblings through the Yosemite Valley—profoundly influenced American ideas about conservation in general and the importance of preserving wild areas in particular.*

    Crane, Caroline Bartlett. “[Municipal Housekeeping](http://hdl.handle.net/2027/mdp.39015008786017).” Reprinted from *Proceedings of Baltimore City-Wide Congress*, March 8, 9, 10, 1911.  *In this 1911 speech, Caroline Bartlett Crane—a Unitarian minister, reformer, and journalist who was widely known as “America’s housekeeper”—makes the case for the importance of keeping urban environments safe and clean, proclaiming that “housekeeping is, in fact, an extremely important function of city government.”*

    Leopold, Aldo. “[Thinking Like a Mountain](http://www.eco-action.org/dt/thinking.html).” In *A Sand County Almanac*. New York: Oxford University Press, 1949. *In this classic essay, a leading conservationist and wildlife manager tells the story of a day when he killed a wolf in the name of conservation—only to realize that his actions might not serve his actual goals. “I was young then, and full of trigger-itch,” he wrote; “I thought that because fewer wolves meant more deer, that no wolves would mean hunters’ paradise. But after seeing the green fire [in the wolf’s eyes] die, I sensed that neither the wolf nor the mountain agreed with such a view.”*
- subpage: 8
  title: Secondary Sources
  content: |-
    Hays, Samuel P. *Conservation and the Gospel of Efficiency: The Progressive Conservation Movement, 1890-1920*. Pittsburgh: University of Pittsburgh Press, 1999.  *First published 1959. This classic history of the conservation movement, which continues to influence historians today, focuses on the rise of technocratic expertise and the ways that conservation policies and their emphasis on the efficient use of natural resources reflected new ideas about political power and political structure in the United States.*

    Stradling, David, ed. *Conservation in the Progressive Era: Classic Texts*. Seattle: University of Washington Press, 2004.  *This edited collection pairs an introductory essay with primary documents written by activists within the conservation movement. Emphasizing the diversity of the movement, the documents reflect the ways that race, class, gender, and geography shaped the issues and concerns that motivated conservationists during the Progressive Era.*

    Warren, Louis. *The Hunter’s Game: Poachers and Conservationists in Twentieth-Century America*. New Haven: Yale University Press, 1997.  *Mixing social and environmental history, Warren analyzes the role that wildlife conservation laws—together with ecological change—played in catalyzing conflict between conservationists and locals, including Native Americans and poor whites.*

    Jacoby, Karl. *Crimes Against Nature: Squatters, Poachers, Thieves, and the Hidden History of Conservation*. Berkeley: University of California Press, 2001.  *Jacoby argues that conservation laws regulating cutting timber, setting fires, hunting animals, and claiming unsettled land created a host of new “crimes against nature”: timber theft, arson, poaching, and squatting. He also demonstrates how these new regulations benefited affluent tourists and professional land managers by placing disproportionate burdens on already marginalized groups.*

    Spence, Mark David. *Dispossessing the Wilderness: Indian Removal and the Making of the National Parks*. New York: Oxford University Press, 1999.  *In case studies of three national parks—Yellowstone, Glacier, and Yosemite—Spence documents the ways that the push to “preserve” these areas for national enjoyment required the eviction of their long-term Native American residents.*

    Langston, Nancy. *Forest Dreams, Forest Nightmares: The Paradox of Old Growth in the Inland West*. Seattle: University of Washington Press, 1995.  *Langston examines the history of professional forestry practices in the Blue Mountains of eastern Washington and Oregon, unpacking the paradoxes of how scientific land-management practices went awry in the face of rapid and unexpected ecological changes.*

    Fiege, Mark. *Irrigated Eden: The Making of an Agricultural Landscape in the American West*. Seattle: University of Washington Press, 1999.  *Fiege’s case study of Idaho’s Snake River Valley focuses on the hopes, labors, and dreams of settlers as they laid out a vast irrigation system to create a new agricultural order, emphasizing the ways the unexpected ecological changes compromised and sometimes short-circuited the best-laid plans of the irrigators.*

    Worster, Donald. *Rivers of Empire: Water, Aridity, and the Growth of the American West*. New York: Pantheon, 1985.  *This classic environmental history offers a history of the American West written through the lens of its water-management practices, emphasizing their role in structuring the environment and society of the West.*

    Steinberg, Ted. *Down to Earth: Nature’s Role in American History*. New York: Oxford University Press, 2002.  *This influential textbook account of American environmental history includes a concise chapter on “Conservation Reconsidered.”*
